html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);overflow:hidden}
#bestatt{height:100%}
.app{background:var(--ground);font-variant-numeric:tabular-nums}
@media (min-width: 520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.lastefeil{max-width:420px;margin:0 auto;padding:48px 20px;font-size:16px;line-height:1.5}
.app *{scrollbar-width:none;-ms-overflow-style:none}
.app *::-webkit-scrollbar{display:none;width:0;height:0}
.app a{color:var(--ink)}
.app button{font-family:inherit;color:inherit}
.app h1,.app h2{text-wrap:balance}
.app a:focus-visible,.app button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.screen{animation:fadein .24s ease}
.card{transition:transform .12s ease, border-color .15s ease, background .15s ease}
.card:hover{border-color:var(--line-strong) !important}
.card:active{transform:scale(.985)}
.primary{transition:transform .12s ease, border-color .15s ease, filter .15s ease}
.primary:hover:not(:disabled){filter:brightness(1.1)}
.primary:active:not(:disabled){transform:scale(.98)}
.primary:disabled{background:var(--track) !important;background-image:none !important;border-color:var(--track) !important;color:var(--muted) !important;cursor:default}
.sec{transition:border-color .15s ease}
.sec:hover:not(:disabled){border-color:var(--ink) !important}
.sec:disabled,.ghost:disabled{color:var(--muted) !important;opacity:.75;cursor:default}
.iconbtn{transition:border-color .15s ease}
.iconbtn:hover{border-color:var(--line-strong) !important}
.opt{border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s ease, background .15s ease}
.opt:hover:not(:disabled){border-color:var(--line-strong)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--ink);background:var(--surface-2)}
.opt.right{border-color:var(--good);background:var(--good-soft);animation:pop .4s ease}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s ease}
.numbox:focus-within{border-color:var(--ink)}
.numbox input::placeholder{color:var(--muted);font-weight:500}
.badge{background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}
.badge.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.badge.right{background:var(--good);color:var(--surface);border-color:var(--good)}
.badge.wrong{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.seg{transition:background .15s ease, color .15s ease}
.fb{animation:rise .3s ease}
.gain{animation:floatup 1.1s ease forwards}
.burst{animation:pop .6s ease}
.stamp{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fadein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-22px)}}
@keyframes stamp{from{transform:rotate(-4deg) scale(1.25);opacity:.2}to{transform:rotate(-4deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.screen,.opt.right,.opt.wrong,.fb,.gain,.burst,.stamp{animation:none}}
</style>
<div id="bestatt"></div>
<template id="bestatt-mal">
<div class="app t-{{themeMode}}" style="width: 100%; height: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box; color: var(--ink); font-family: var(--font-body); position: relative; overflow: hidden">

<sc-if value="{{scr.login}}" hint-placeholder-val="{{ false }}">
<div class="screen" style="height: 100%; display: flex; flex-direction: column">
  <header style="display: flex; justify-content: flex-end; padding: 20px 20px 0">
    <button class="iconbtn" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"></path></svg>
      </sc-if>
      <sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
      </sc-if>
    </button>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 0 24px 24px; display: flex; flex-direction: column; justify-content: center; gap: 40px">

<sc-if value="{{scr.subject}}" hint-placeholder-val="{{ false }}">
<div class="screen" style="height: 100%; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 18px 12px 8px">
    <button onClick="{{goHome}}" aria-label="Tilbake til forsiden" style="width: 44px; height: 44px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 23px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">{{subj.name}}</h1>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px">
    <section style="{{subj.cardStyle}}">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2)">Mestring</span>
        <span style="font-size: 14px; color: var(--text-2)">{{subj.mastered}} av {{subj.total}} begreper</span>
      </div>
      <div style="height: 8px; border-radius: 4px; background: var(--track); overflow: hidden"><div style="{{subj.barStyle}}"></div></div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 6px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: var(--text-2)">Klar for eksamen</span>
          <span style="font-family: var(--font-display); font-size: 40px; font-weight: 700; letter-spacing: -0.035em; line-height: 1">{{subj.ready}} %</span>
        </div>
        <span style="{{subj.readyStyle}}">{{subj.readyLabel}}</span>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-2)">Regnes ut fra hvor mange begreper du mestrer og hvor mange du har svart riktig på i de siste 20 spørsmålene. Et begrep er mestret når du har svart riktig på tre ulike spørsmålstyper.</p>
    </section>

    <sc-for list="{{subj.topics}}" as="t" hint-placeholder-count="3">
      <section style="background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px 16px 6px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow)">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">{{t.name}}</h2>
          <span style="font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex-shrink: 0">{{t.mastered}}/{{t.total}}</span>
        </div>
        <div style="height: 6px; border-radius: 3px; background: var(--track); overflow: hidden"><div style="{{t.barStyle}}"></div></div>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{t.concepts}}" as="c" hint-placeholder-count="3">
            <button onClick="{{c.open}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 0; border: none; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; width: 100%">
              <span style="{{c.dotStyle}}"></span>
              <span style="flex: 1; font-size: 15px; font-weight: 600">{{c.name}}</span>
              <span style="{{c.statusStyle}}">{{c.status}}</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted); flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
  <footer style="padding: 12px 20px 20px; border-top: 1px solid var(--line); background: var(--ground); display: flex; flex-direction: column; gap: 10px">
    <button class="primary" onClick="{{subj.startQuick}}" style="{{subj.primaryStyle}}">Rask økt <span style="font-weight: 500; opacity: .75; font-size: 15px">· 10 spm · 3 min</span></button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button class="sec" onClick="{{subj.startExam}}" style="min-height: 52px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 700; cursor: pointer; line-height: 1.25; padding: 6px 8px">Eksamensmodus<br><span style="font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 11px">30 spm · 15 min</span></button>
      <button class="sec" onClick="{{subj.startWeak}}" disabled="{{subj.weakDisabled}}" style="min-height: 52px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 700; cursor: pointer; line-height: 1.25; padding: 6px 8px">Svake punkter<br><span style="font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 11px">{{subj.weakSub}}</span></button>
    </div>
  </footer>
</div>
</sc-if>

<sc-if value="{{scr.concept}}" hint-placeholder-val="{{ false }}">
<div class="screen" style="height: 100%; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 18px 12px 8px">
    <button onClick="{{con.back}}" aria-label="Tilbake til faget" style="width: 44px; height: 44px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <span style="display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); min-width: 0"><span style="{{con.dotStyle}}"></span>{{con.topic}}</span>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 6px 20px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 4px 0 6px">
      <h1 style="margin: 0; font-family: var(--font-display); font-size: 33px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.08">{{con.name}}</h1>
      <sc-if value="{{con.unverified}}" hint-placeholder-val="{{ true }}">
        <span style="font-size: 12px; letter-spacing: 0.04em; color: var(--muted)">{{con.unverifiedText}}</span>
      </sc-if>
    </div>
    <section style="background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow)">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em">Kort forklart</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.6">{{con.x}}</p>
    </section>
    <sc-if value="{{con.isFq}}" hint-placeholder-val="{{ false }}">
    <section style="background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow)">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em">Spørsmål og svar</h2>
      <sc-for list="{{con.fq}}" as="f" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px">
          <span style="{{f.markStyle}}">{{f.mark}}</span>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 15px; font-weight: 600; line-height: 1.4">{{f.q}}</span>
            <span style="font-size: 14px; line-height: 1.5; color: var(--text-2)">{{f.a}}</span>
            <sc-if value="{{f.unconfirmed}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 12px; letter-spacing: 0.04em; color: var(--muted)">Svaret er ikke bekreftet i quizen</span>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </section>
    </sc-if>
    <sc-if value="{{con.hasMis}}" hint-placeholder-val="{{ true }}">
    <section style="background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow)">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em">Vanlige misforståelser</h2>
      <sc-for list="{{con.mis}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px">
          <span style="width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; background: var(--bad-soft); color: var(--bad-ink)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
          </span>
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 15px; font-weight: 600; line-height: 1.4">{{m.c}}</span>
            <span style="font-size: 14px; line-height: 1.5; color: var(--text-2)">{{m.w}}</span>
          </div>
        </div>
      </sc-for>
    </section>
    </sc-if>
    <sc-if value="{{con.hasEx}}" hint-placeholder-val="{{ true }}">
    <section style="background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow)">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em">Eksempler</h2>
      <sc-for list="{{con.ex}}" as="e" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px; font-size: 15px; line-height: 1.5">
          <span style="{{con.bulletStyle}}"></span>
          <span style="min-width: 0">{{e}}</span>
        </div>
      </sc-for>
    </section>
    </sc-if>
    <section style="background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow)">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em">Din fremdrift</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.5">{{con.statusText}}</p>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{con.types}}" as="ty" hint-placeholder-count="5">
          <span style="{{ty.chipStyle}}">{{ty.label}}</span>
        </sc-for>
      </div>
    </section>
  </main>
  <footer style="padding: 12px 20px 20px; border-top: 1px solid var(--line); background: var(--ground)">
    <button class="primary" onClick="{{con.start}}" style="height: 60px; border-radius: 30px; border: 1px solid var(--cta-line); background-color: var(--cta); background-image: linear-gradient(180deg, var(--cta-hi), transparent); color: var(--cta-fg); font-size: 17px; font-weight: 700; cursor: pointer; width: 100%">Øv på dette begrepet <span style="font-weight: 500; color: var(--cta-sub); font-size: 15px">· 4 spm</span></button>
  </footer>
</div>
</sc-if>

<sc-if value="{{scr.question}}" hint-placeholder-val="{{ false }}">
<div style="height: 100%; display: flex; flex-direction: column">
  <header style="padding: 18px 20px 8px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <button onClick="{{qv.exit}}" aria-label="Avslutt økten" style="width: 44px; height: 44px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <div style="flex: 1; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden" role="progressbar" aria-label="Fremdrift i økten" aria-valuemin="0" aria-valuemax="{{qv.total}}" aria-valuenow="{{qv.done}}">
        <div style="{{qv.progressStyle}}"></div>
      </div>
      <sc-if value="{{qv.isExam}}" hint-placeholder-val="{{ false }}">
        <div style="{{qv.timerStyle}}" aria-label="Tid igjen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 3h6"></path></svg>
          {{qv.timerText}}
        </div>
      </sc-if>
      <sc-if value="{{qv.isPractice}}" hint-placeholder-val="{{ true }}">
        <div style="position: relative; display: flex; align-items: center; gap: 5px; height: 40px; padding: 0 13px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 14px; font-weight: 600; flex-shrink: 0">
          <svg width="15" height="15" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="fill: var(--gold); stroke: var(--gold-ink)"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
          {{qv.xp}}
          <sc-if value="{{qv.showGain}}" hint-placeholder-val="{{ false }}">
            <span class="gain" style="position: absolute; right: 8px; top: -18px; font-size: 14px; font-weight: 700; color: var(--good-ink)">+{{qv.gainTotal}}</span>
          </sc-if>
        </div>
      </sc-if>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0">
        <span style="font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--text-2)">{{qv.counter}}</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600"><span style="{{qv.dotStyle}}"></span>{{qv.subjShort}}</span>
        <span style="font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--text-2)">{{qv.type}}</span>
        <sc-if value="{{qv.showCombo}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink)">Combo ×{{qv.combo}}</span>
        </sc-if>
      </div>

      // ----- Introduksjon til entreprenørskap: faste flervalgsspørsmål fra quizene dine -----
      // fq: [spørsmål, riktig svar, [feil svar], forklaring, 1 = riktig svar stod i quizen / 0 = satt av Claude]
      { id: 'ent-hvorfor', s: 'ent', t: 'grunnlag', n: 'Hvorfor lære entreprenørskap?',
        x: 'Entreprenørskap angår alle, ikke bare dem som vil starte bedrift. Vi må i økende grad skape vår egen karriere, etablerte organisasjoner trenger kontinuerlig fornyelse, og entreprenørskap bidrar til samfunnet gjennom konkurranse og løsninger på blant annet miljøproblemer.',
        fq: [
          ["Hvorfor er det viktig for unge mennesker å lære om entreprenørskap, selv om de ikke planlegger å starte egen bedrift?", "Fordi de må kunne handle entreprenørielt i sin egen utdanning og karriere.", ["Fordi tradisjonelle jobber vil slutte å eksistere i løpet av ti år.", "Fordi de må lære hvordan man unngår å betale skatt som selvstendig næringsdrivende.", "Fordi det er det eneste faget som gir garantert jobb etterpå."], "Entreprenørskap handler om å skape og gripe muligheter, og det trenger man også i utdanning og karriere, selv uten å starte bedrift.", 1],
          ["I en ‘elevator pitch’ for eksisterende organisasjoner, hva er hovedverdien av entreprenørskap?", "Kontinuerlig fornyelse og differensiering i et globalisert marked.", ["Bedre planlegging og koordinering av daglige rutiner.", "Muligheten til å redusere antall ansatte gjennom automatisering.", "Å kunne kopiere konkurrenters suksess raskere."], "For etablerte organisasjoner ligger verdien i å fornye seg og skille seg ut, noe som blir viktigere i et globalt marked med hard konkurranse.", 1],
          ["Hvorfor hevder kilden at vi alle er ‘entreprenører av selvet’?", "Fordi vi i økende grad må skape vår egen karriere i et skiftende arbeidsmarked.", ["Fordi moderne selskaper krever at ansatte investerer egne penger i bedriften.", "Fordi alle mennesker har en medfødt evne til å starte bedrifter.", "Fordi det er blitt en kulturell norm å se på seg selv som et produkt."], "Faste karriereløp blir sjeldnere. Hver enkelt må i større grad forme sin egen karriere, og det krever entreprenøriell tenkning.", 1],
          ["Hvordan bidrar entreprenørskap til samfunnet utover økonomisk vekst?", "Ved å skape sunn konkurranse og løse miljø- eller klimaproblemer.", ["Ved å garantere at ingen bedrifter går konkurs.", "Ved å eliminere behovet for offentlig sektor.", "Ved å sørge for at alle i samfunnet har lik lønn."], "Nye aktører utfordrer etablerte bedrifter og kan utvikle løsninger på samfunnsproblemer, for eksempel innen miljø og klima.", 1],
          ["Hva er den primære motivasjonen for mange studenter som ønsker å bli entreprenører, ifølge undersøkelser nevnt i kilden?", "Behov for uavhengighet og mestring.", ["Å unngå tradisjonelle arbeidsoppgaver og faste rammer.", "Et ønske om raskest mulig økonomisk gevinst.", "At det er den eneste måten å få en trygg karriere på i dagens marked."], "Undersøkelsene viser at uavhengighet og ønsket om å mestre noe eget veier tyngre enn rask økonomisk gevinst.", 1]
        ] },

      { id: 'ent-def', s: 'ent', t: 'grunnlag', n: 'Hva er entreprenørskap?',
        x: 'Boken definerer entreprenørskap bredt: som fremkomsten av nye muligheter, evalueringen av dem og organiseringen av dem. Entreprenørskap skaper noe som ikke finnes, mens ledelse drifter det som allerede er der. Prosessen er iterativ og overlappende, ikke lineær.',
        fq: [
          ["Hvordan definerer boken entreprenørskap i et bredt perspektiv?", "Som et fenomen knyttet til fremkomsten av nye muligheter, deres evaluering og organisering.", ["Som en psykologisk tilstand der individet har en medfødt trang til å ta høy risiko.", "Eksklusivt som dannelsen av nye, uavhengige organisasjoner i privat sektor.", "Som kunsten å maksimere profitt gjennom effektiv ledelse av eksisterende ressurser."], "Den brede definisjonen gjelder både nye og eksisterende organisasjoner, og ser entreprenørskap som en prosess fra mulighet til organisering.", 1],
          ["Hva er den viktigste forskjellen på entreprenørskap og tradisjonell ledelse (management) ifølge kilden?", "Entreprenørskap handler om å skape noe som ikke finnes, mens ledelse handler om å drifte det eksisterende.", ["Entreprenørskap krever ingen planlegging, i motsetning til ledelse.", "Entreprenører tjener alltid mer penger enn ledere.", "Ledelse utføres kun i store bedrifter, mens entreprenørskap kun skjer i små."], "Ledelse handler om å drifte og forbedre det som finnes. Entreprenørskap handler om å skape noe nytt.", 1],
          ["Boken foreslår en spiral-modell for entreprenørskap (Figur 1.3). Hva representerer denne spiralen?", "At prosessen er iterativ, parallell og overlappende snarere enn lineær.", ["At entreprenørens motivasjon øker over tid.", "At man starter bredt og snevrer inn til én enkelt løsning.", "At kostnadene i et oppstartsprosjekt ofte spinner ut av kontroll."], "Spiralen viser at fremkomst, evaluering og organisering skjer om hverandre og gjentas, i stedet for i en fast rekkefølge.", 1]
        ] },

      { id: 'ent-kontekst', s: 'ent', t: 'grunnlag', n: 'Kontekst og internasjonale forskjeller',
        x: 'Entreprenørskap skjer alltid i en kontekst. Konteksten påvirker tilgangen til ressurser og nettverk, og hvilke normer som gjelder. Derfor varierer både omfanget av entreprenørskap og andelen kvinnelige entreprenører mye mellom land.',
        fq: [
          ["Hva slags rolle spiller ‘kontekst’ for entreprenørskapsprosessen, ifølge kilden?", "Den påvirker tilgangen til ressurser, nettverk og hvilke normer som gjelder.", ["Den bestemmer nøyaktig om en bedrift vil lykkes eller ikke.", "Den er irrelevant så lenge entreprenøren har en god nok idé.", "Den handler utelukkende om nasjonal lovgivning og skatteregler."], "Konteksten avgjør ikke alene om en bedrift lykkes, men den former hvilke ressurser, nettverk og normer entreprenøren møter.", 1],
          ["Hvorfor er det store internasjonale variasjoner i antall kvinnelige entreprenører?", "Kulturelle normer og verdier knyttet til kjønnsroller i samfunnet.", ["At kvinner generelt har lavere utdanningsnivå i utviklingsland.", "Internasjonal lovgivning som forbyr kvinner å eie kapital.", "At kvinner foretrekker å jobbe i offentlig sektor i alle land."], "Kjønnsroller og kulturelle normer varierer mellom samfunn og påvirker hvem som ser på entreprenørskap som et naturlig valg.", 1],
          ["Ifølge GEM-data fra 2015, hvilket land hadde den høyeste andelen voksne involvert i oppstartsvirksomhet?", "Ecuador", ["Danmark", "USA", "Japan"], "GEM-dataene fra 2015 viste høyest andel voksne i oppstartsvirksomhet i Ecuador. Mye av entreprenørskapet i slike land er nødvendighetsbasert.", 1]
        ] },

      { id: 'ent-pionerer', s: 'ent', t: 'tradisjoner', n: 'Historiske pionerer',
        x: 'Richard Cantillon så entreprenøren som en som utnytter prisforskjeller under usikkerhet. Joseph Schumpeter så entreprenøren som en innovatør som skaper nye kombinasjoner og kreativ destruksjon. Frank Knight knyttet entreprenørskap til usikkerhet, og David McClelland til behovet for prestasjon.',
        fq: [
          ["Hvilken historisk pioner så på entreprenøren som en person som utnytter prisforskjeller for å bringe økonomien mot likevekt?", "Richard Cantillon", ["David McClelland", "Frank Knight", "Joseph Schumpeter"], "Cantillon beskrev entreprenøren som en som kjøper til kjent pris og selger til usikker pris, og dermed utnytter prisforskjeller. Schumpeter er derimot kjent for å bryte likevekten.", 1],
          ["Hvilken historisk figur beskrev entreprenøren som en ‘innovatør’ som skaper nye produkter eller produksjonsmetoder?", "Joseph Schumpeter", ["Richard Cantillon", "David McClelland", "Frank Knight"], "Schumpeter så entreprenøren som innovatøren som introduserer nye produkter, metoder, markeder, råvarekilder eller organisasjonsformer.", 1],
          ["Hvilken historisk figur i entreprenørskapsteori er mest kjent for begrepet ‘kreativ destruksjon’?", "Joseph Schumpeter.", ["Israel Kirzner.", "David McClelland.", "Frank Knight."], "Schumpeter beskrev hvordan nye innovasjoner fortrenger gamle produkter og bedrifter, og kalte det kreativ destruksjon.", 0]
        ] },

      { id: 'ent-schumpeter', s: 'ent', t: 'tradisjoner', n: 'Schumpeter og kreativ destruksjon',
        x: 'Ifølge Schumpeter skaper entreprenøren nye kombinasjoner: nye produkter, nye produksjonsmetoder, nye markeder, nye kilder til råvarer og ny organisering av en bransje. Det bryter den økonomiske likevekten, og de nye løsningene utkonkurrerer de gamle. Det kalte han kreativ destruksjon.',
        fq: [
          ["Hva er kjernen i Joseph Schumpeters konsept om ‘kreativ destruksjon’?", "Nye innovasjoner og organisasjoner erstatter og utkonkurrerer de gamle.", ["At feiling og konkurs er nødvendig for at en gründer skal lære.", "Entreprenører må fysisk ødelegge gamle produksjonsmidler for å bygge nye.", "En prosess der man dekonstruerer komplekse ideer for å finne enkle løsninger."], "Kreativ destruksjon betyr at det nye fortrenger det gamle: nye produkter og bedrifter tar over for de etablerte.", 1],
          ["Hvilken av disse er IKKE en av Schumpeters fem måter å skape nye kombinasjoner på?", "Senking av priser på eksisterende produkter.", ["Åpning av et nytt marked.", "Utnyttelse av nye kilder for råmaterialer.", "Introduksjon av en ny produksjonsmetode."], "De fem nye kombinasjonene er nye produkter, nye produksjonsmetoder, nye markeder, nye råvarekilder og ny organisering. Å senke prisen på et eksisterende produkt er ingen ny kombinasjon.", 1],
          ["Hva er entreprenørens rolle i Schumpeters teori om ‘kreativ destruksjon’?", "En innovatør som bryter den økonomiske likevekten ved å skape noe nytt.", ["En person som prøver å opprettholde status quo i markedet.", "En investor som kun bidrar med kapital uten egne ideer.", "En ansatt som følger ordrer fra ledelsen."], "Hos Schumpeter er entreprenøren innovatøren som bryter likevekten i markedet ved å introdusere noe nytt.", 0]
        ] },

      { id: 'ent-knight', s: 'ent', t: 'tradisjoner', n: 'Usikkerhet (Knight)',
        x: 'Frank Knight skilte mellom tre typer usikkerhet: risiko der sannsynlighetene er kjent på forhånd, risiko der sannsynlighetene kan anslås ut fra data, og sann usikkerhet, der fremtiden ikke er skapt ennå og ingen sannsynligheter kan beregnes. Entreprenørskap handler om å handle under sann usikkerhet.',
        fq: [
          ["Hva menes med ‘true uncertainty’ i entreprenørskapssammenheng?", "Situasjoner der man ikke kan vite noe om fremtiden fordi den ikke er skapt ennå.", ["Når en gründer ikke er sikker på om de har nok penger til neste måned.", "Når alle markedsanalyser viser motstridende resultater.", "At man er usikker på egne evner som leder."], "Sann usikkerhet handler ikke om manglende penger eller selvtillit, men om at fremtiden ennå ikke finnes og derfor ikke kan kjennes.", 1],
          ["Frank Knight skiller mellom tre typer usikkerhet. Hva kjennetegner det han kaller ‘sann usikkerhet’?", "At fremtidige utfall ikke eksisterer ennå, og sannsynligheter kan ikke beregnes.", ["At konkurrentenes handlinger er umulige å forutse.", "At alle mulige utfall er kjent, men vi vet ikke hvilket som vil inntreffe.", "At utfallet er sikkert, men entreprenøren mangler ressursene til å nå det."], "Når alle utfall er kjent, men vi ikke vet hvilket som inntreffer, er det risiko. Ved sann usikkerhet finnes utfallene ikke ennå.", 1]
        ] },

      { id: 'ent-tradisjoner', s: 'ent', t: 'tradisjoner', n: 'Fremkomst- og mulighetstradisjonen',
        x: 'Fremkomsttradisjonen ser entreprenørskap som organiseringsprosessen som fører til en ny organisasjon. Mulighetstradisjonen, inspirert av blant andre Kirzner og Shane, ser på oppdagelse og utnyttelse av muligheter, enten det skjer i en ny eller en eksisterende organisasjon.',
        fq: [
          ["Hva er det sentrale fokuset i ‘fremkomsttradisjonen’ (emergence tradition)?", "Entreprenørskap som en organiseringsprosess som fører til en ny organisasjon.", ["Den historiske fremkomsten av kapitalisme.", "Statlige subsidier som får nye bransjer til å oppstå.", "Hvordan nye ideer plutselig ‘dukker opp’ i hodet på folk."], "Fremkomsttradisjonen, med blant andre Gartner, studerer hvordan nye organisasjoner blir til gjennom organisering.", 1],
          ["Hvordan skiller mulighetstradisjonen (opportunity tradition) seg fra fremkomsttradisjonen?", "Den fokuserer på oppdagelse og utnyttelse av muligheter, uavhengig av om det skjer i en ny eller eksisterende organisasjon.", ["Den ser på entreprenørskap utelukkende som en økonomisk kalkyle.", "Den hevder at muligheter kun kan finnes av folk med lang erfaring.", "Den mener at organisering er mindre viktig enn selve ideen."], "Mulighetstradisjonen flytter fokus fra den nye organisasjonen til selve muligheten, som kan utnyttes både i nye og etablerte organisasjoner.", 1],
          ["Hvilken tradisjon fokuserer på entreprenørens ‘våkenhet’ (alertness) for å oppdage markedshull?", "Mulighetstradisjonen (inspirert av Kirzner).", ["Den historiske økonomiske tradisjonen (Cantillon).", "Fremkomsttradisjonen.", "Den sosial-psykologiske tradisjonen."], "Kirzner beskrev entreprenøren som årvåken for muligheter andre har oversett. Det er et kjernebegrep i mulighetstradisjonen.", 1],
          ["Eckhardt og Shane (2003) definerer muligheter på en spesifikk måte. Hva er et kritisk element i deres definisjon?", "Opprettelsen av nye ‘mål-middel’-kjeder.", ["At muligheten må være godkjent av offentlige myndigheter.", "Å finne den billigste måten å produsere en eksisterende vare på.", "Å ha en stor mengde kapital tilgjengelig fra start."], "Eckhardt og Shane ser muligheter som situasjoner der nye varer, tjenester, råvarer, markeder eller organiseringsmåter kan introduseres gjennom nye mål-middel-sammenhenger.", 1]
        ] },

      { id: 'ent-gartner', s: 'ent', t: 'tradisjoner', n: 'Gartner og kritikken av trekk-forskningen',
        x: 'William Gartner kritiserte forskningen som lette etter entreprenørens særtrekk. I 1988 skrev han at ‘Hvem er entreprenøren?’ er feil spørsmål, og at vi heller bør se på hva entreprenører gjør. Kontingensmodellen hans fra 1985 ser individ, prosess, organisasjon og miljø i sammenheng.',
        fq: [
          ["Hva var Gartners (1988) hovedkritikk mot den psykologiske tradisjonen?", "At det er feil spørsmål å spørre ‘Hvem er entreprenøren?’.", ["At alle entreprenører har nøyaktig de samme trekkene uansett.", "At psykologiske tester er for dyre å gjennomføre i stor skala.", "At entreprenørskap kun handler om flaks, ikke personlighet."], "Gartner mente at forskningen burde studere hva entreprenører gjør, altså atferd og prosesser, i stedet for å lete etter en bestemt personlighetstype.", 1],
          ["Hva refererer Gartners (2001) analogi om de blinde mennene og elefanten til i entreprenørskapsforskning?", "At ulike forskere ser på forskjellige deler av entreprenørskap og derfor definerer det ulikt.", ["At entreprenører ofte er ‘blinde’ for risikoen de tar når de starter noe nytt.", "At entreprenørskap er et så stort fenomen at det er umulig å studere vitenskapelig.", "At suksessrike entreprenører har en unik evne til å se hele bildet som andre overser."], "Som de blinde mennene som kjenner på hver sin del av elefanten, studerer forskere ulike sider av entreprenørskap og ender med ulike definisjoner.", 1],
          ["Ifølge Gartners kontingensmodell (1985), hvilke fire variabler må ses i sammenheng for å forstå nyskaping?", "Individ, prosess, organisasjon og miljø.", ["Risiko, intuisjon, optimisme og beslutning.", "Ide, kapital, nettverk og marked.", "Fødsel, oppvekst, utdanning og karriere."], "Gartners rammeverk fra 1985 sier at nyskaping må forstås gjennom samspillet mellom individet, prosessen, organisasjonen og miljøet.", 0],
          ["Hvilken kritikk ble rettet mot trekk-forskningen (traits) på 1980-tallet?", "At den ignorerte miljøfaktorer og presenterte entreprenøren som et ‘overmenneske’.", ["At den var for teknisk og komplisert for studenter.", "At den kun studerte kvinnelige entreprenører.", "At den var for fokusert på økonomiske modeller."], "Kritikken var at trekk-forskningen så bort fra omgivelsene og framstilte entreprenøren som en helt spesiell type menneske.", 0]
        ] },

      { id: 'ent-typer', s: 'ent', t: 'individ', n: 'Typer entreprenører',
        x: 'Nascent (vordende) entreprenører tar de første stegene. Novice entreprenører starter for første gang, mens habitual entreprenører har gjort det før. Blant dem starter serielle entreprenører én virksomhet etter en annen, mens portfolio-entreprenører eier flere samtidig. Hybride entreprenører kombinerer lønnsarbeid med egen virksomhet, og nødvendighetsbaserte entreprenører starter fordi de mangler alternativer.',
        fq: [
          ["Hva kjennetegner en ‘nascent’ (vordende) entreprenør?", "En person som er i ferd med å ta de første stegene for å starte en bedrift.", ["En person som nylig har lagt ned bedriften sin.", "En erfaren bedriftseier som starter sin andre eller tredje virksomhet.", "En investor som kun bidrar med kapital, men ingen arbeidskraft."], "En nascent entreprenør er i ferd med å starte, men har ennå ikke en etablert virksomhet.", 1],
          ["Hva kalles fenomenet der entreprenører føler seg ‘tvunget’ inn i yrket på grunn av manglende alternativer?", "Nødvendighetsbasert entreprenørskap (Necessity entrepreneurship).", ["Lidenskapsprosjekter.", "Mulighetsbasert entreprenørskap (Opportunity entrepreneurship).", "Strategisk entreprenørskap."], "Nødvendighetsbasert entreprenørskap oppstår når man starter for seg selv fordi andre jobbmuligheter mangler. Det motsatte er mulighetsbasert entreprenørskap.", 0],
          ["Hva kjennetegner en ‘habitual’ entreprenør?", "En person som har tidligere erfaring med entreprenørskap.", ["En person som bare har teoretisk kunnskap om faget.", "En person som gjør det til en vane å mislykkes.", "En person som jobber fast i det offentlige."], "En habitual entreprenør har tidligere erfaring med å starte virksomheter.", 0],
          ["Hva er en ‘hybrid’ entreprenør?", "En person som er både lønnsmottaker og selvstendig næringsdrivende samtidig.", ["En person som utvikler miljøvennlige biler.", "En blanding mellom en investor og en oppfinner.", "En entreprenør som bruker både analoge og digitale verktøy."], "En hybrid entreprenør har både en lønnet jobb og egen virksomhet samtidig.", 0],
          ["Hva kjennetegner en person som defineres som en ‘portfolio’-entreprenør?", "En person som eier flere organisasjoner samtidig.", ["En person som starter og selger selskaper i en sekvens.", "En person som fungerer som entreprenør i en eksisterende bedrift.", "En person uten tidligere erfaring med å starte virksomheter."], "Portfolio-entreprenører eier flere virksomheter samtidig, mens serielle entreprenører starter og selger én etter én.", 0],
          ["Hva er forskjellen på ‘nascent’ og ‘habitual’ entreprenører?", "Nascent er i startfasen, habitual har gjort det flere ganger før.", ["Nascent feiler alltid, habitual lykkes alltid.", "Nascent jobber deltid, habitual jobber heltid.", "Nascent er alltid unge, habitual er alltid gamle."], "Nascent entreprenører er i startfasen, mens habitual entreprenører har startet virksomheter før.", 0],
          ["Hva er den viktigste forskjellen mellom en ‘novice’ og en ‘habitual’ entreprenør?", "Tidligere erfaring med å starte og drive virksomheter.", ["Alder og utdanningsnivå.", "Hvorvidt de jobber i det offentlige eller private.", "Hvor mye penger de har i banken."], "Novice entreprenører starter for første gang. Habitual entreprenører har erfaring fra tidligere oppstarter.", 0],
          ["Hva kjennetegner en ‘Hybrid Entrepreneur’?", "En person som kombinerer lønnsarbeid med å være selvstendig næringsdrivende.", ["En person som selger både fysiske og digitale produkter.", "En gründer som har to forskjellige selskaper samtidig.", "En person som bruker både bensin og elektrisitet i bilen sin."], "Hybride entreprenører kombinerer lønnsarbeid med egen virksomhet, ofte for å redusere risikoen ved oppstart.", 0]
        ] },

      { id: 'ent-fodt', s: 'ent', t: 'individ', n: 'Født eller skapt?',
        x: 'Paradokset handler om entreprenører er født eller skapt. Født-perspektivet vektlegger stabile, medfødte personlighetstrekk. Skapt-perspektivet mener at entreprenøriell kompetanse utvikles gjennom erfaring og sosial samhandling. Moderne atferdsgenetikk peker på samspillet mellom gener og miljø.',
        fq: [
          ["Hva er kjernebudskapet i ‘skapt’-perspektivet angående læring og erfaring?", "Entreprenøriell kompetanse utvikles gjennom livserfaring og sosiale interaksjoner.", ["Entreprenørskap er en medfødt gave som ikke kan trenes opp.", "Kun de med økonomisk utdanning kan bli suksessfulle.", "Man kan kun lære entreprenørskap ved å lese bøker."], "Skapt-perspektivet ser entreprenøriell kompetanse som noe som læres og utvikles gjennom livserfaring og samhandling med andre.", 0],
          ["Hva er den viktigste lærdommen fra moderne atferdsgenetikk i studiet av entreprenører?", "Det er kombinasjoner av gener i samspill med miljøet som betyr noe.", ["Miljøet har ingen betydning dersom man har de rette genene.", "Gener påvirker kun fysiske trekk, ikke karrierevalg.", "Det finnes ett spesifikt ‘entreprenør-gen’ som kan identifiseres."], "Atferdsgenetikken finner ikke ett entreprenørgen, men viser at kombinasjoner av gener virker sammen med miljøet.", 0],
          ["I paradokset ‘født eller skapt’, hva er kjernefokuset i ‘født’-perspektivet?", "Stabile personlighetstrekk og karaktertrekk som er medfødte.", ["Interaksjonen mellom individet og dets omgivelser.", "Utdanning og spesialisert opplæring i ledelse.", "Sosial påvirkning og oppvekstvilkår."], "Født-perspektivet forklarer entreprenørskap med stabile, medfødte personlighetstrekk.", 0]
        ] },

      { id: 'ent-trekk', s: 'ent', t: 'individ', n: 'Personlighetstrekk',
        x: 'Den sosial-psykologiske tradisjonen, med McClelland, la vekt på behovet for prestasjon. Senere forskning har samlet trekk som ofte omtales som ‘entrepreneurship’s big five’, blant annet behov for prestasjon og intern kontrollplassering. Behov for autonomi og mestringstro (self-efficacy) trekkes også fram.',
        fq: [
          ["Hvilket kjennetegn sto sentralt i den sosial-psykologiske tradisjonen (f.eks. McClelland)?", "Behovet for prestasjon (Need for Achievement).", ["Formell utdanning innen forretningsførsel.", "Evnen til å beregne finansiell risiko matematisk.", "Tilgangen til sosiale nettverk i lokalmiljøet."], "McClelland mente at et sterkt behov for prestasjon (need for achievement) kjennetegner entreprenører.", 1],
          ["Hvilket av følgende trekk inngår i det litteraturen kaller ‘Entrepreneurship’s Big Five’?", "Intern kontrollplassering (Internal locus of control).", ["Høy intelligenskvotient (IQ).", "Aggressiv lederstil.", "Ekstroversjon og sosiale ferdigheter."], "Intern kontrollplassering, troen på at man selv styrer hva som skjer, regnes som et sentralt entreprenørielt trekk. Ekstroversjon hører til den generelle femfaktormodellen.", 0],
          ["Hva innebærer ‘need for autonomy’ for en entreprenør?", "Et sterkt ønske om å være sin egen herre og ha uavhengighet.", ["Et ønske om å følge faste rutiner i en stor bedrift.", "Behovet for å ha mange ansatte under seg.", "Et behov for å få hjelp fra andre til enhver tid."], "Need for autonomy er ønsket om å være sin egen sjef og bestemme selv.", 0],
          ["Hvorfor er ‘self-efficacy’ (mestringstro) viktig for en entreprenør?", "Det gir tro på at man har evnen til å utføre oppgavene som kreves for å lykkes.", ["Det gjør at man slipper å samarbeide med andre.", "Det fjerner all risiko fra det entreprenørielle prosjektet.", "Det garanterer at man aldri gjør feil i driften."], "Mestringstro er troen på at man klarer oppgavene som kreves. Den gjør at man tør å prøve og står i motgang.", 0]
        ] },

      { id: 'ent-kognisjon', s: 'ent', t: 'individ', n: 'Entreprenøriell kognisjon',
        x: 'Kognitiv forskning ser på hvordan entreprenører tenker. De stoler ofte på intuisjon, er optimistiske til tross for usikkerhet og generaliserer gjerne ut fra få observasjoner. Det kan forklare hvorfor de tør å handle når informasjonen er begrenset. Årvåkenhet er evnen til å legge merke til muligheter uten å lete aktivt.',
        fq: [
          ["Hvordan påvirker ‘intuisjon’ entreprenørens adferd ifølge kognitiv teori?", "Den gjør at de stoler på en indre følelse fremfor å samle inn mer informasjon.", ["Den er vitenskapelig bevist å alltid gi korrekte svar.", "Den brukes kun i krisesituasjoner når alt annet har feilet.", "Den tvinger dem til å vente til alle data er analysert."], "Intuisjon gjør at entreprenøren handler på en indre fornemmelse i stedet for å vente på mer informasjon.", 0],
          ["Hva innebærer begrepet ‘optimisme’ i en entreprenøriell kognitiv sammenheng?", "En tendens til å gripe muligheter til tross for usikkerhet om utfallet.", ["At man alltid forventer høyest mulig profitt med en gang.", "En tro på at andre vil gjøre jobben for deg.", "En naiv tro på at man aldri kan mislykkes."], "Optimisme i denne sammenhengen betyr at man griper muligheter selv om utfallet er usikkert.", 0],
          ["Hvorfor har kognitive forskere fokusert på entreprenørers vilje til å generalisere ut fra små utvalg?", "Fordi det forklarer hvorfor de tør å ta store beslutninger med begrenset informasjon.", ["Fordi det er en forutsetning for å få lån i banken.", "Fordi entreprenører generelt er dårligere til å tolke statistikk enn andre.", "Fordi det sikrer at de alltid treffer riktige beslutninger i markedet."], "Viljen til å generalisere fra få observasjoner kan forklare hvorfor entreprenører tør å ta store beslutninger med lite informasjon.", 0],
          ["Hvilken kognitiv egenskap er knyttet til ‘alertness’ (årvåkenhet) i entreprenørskap?", "Evnen til å legge merke til muligheter uten aktiv søking.", ["Konstant overvåking av konkurrentenes priser.", "Evnen til å holde seg våken mange timer i døgnet.", "En frykt for at man alltid blir lurt av andre."], "Årvåkenhet (Kirzner) er evnen til å oppdage muligheter uten å lete systematisk etter dem.", 0]
        ] },

      { id: 'ent-ajzen', s: 'ent', t: 'individ', n: 'Ajzens teori om planlagt atferd',
        x: 'Ifølge Ajzen avhenger intensjonen om å handle av tre forhold: holdningen til handlingen (hvor gunstig den virker), subjektive normer (opplevd sosialt press) og opplevd atferdskontroll (hvor lett eller vanskelig man tror det er å gjennomføre).',
        fq: [
          ["I Ajzens teori om planlagt atferd, hva beskriver ‘subjektive normer’?", "I hvilken grad individet opplever et sosialt press for å utføre handlingen.", ["De formelle lovene og reglene i et land.", "Entreprenørens personlige etiske kompass.", "Individets egen vurdering av hvor vanskelig prosjektet er."], "Subjektive normer er det sosiale presset man opplever fra for eksempel familie og venner. Vurderingen av hvor vanskelig det er, er opplevd atferdskontroll.", 0],
          ["Hvilken variabel i Ajzens modell handler om hvor gunstig individet anser handlingen for å være?", "Holdning til adferden (Attitude towards the behaviour).", ["Økonomisk kapital (Financial capital).", "Markedets etterspørsel (Market demand).", "Sosial arv (Social heritage)."], "Holdningen til atferden er hvor positivt eller negativt man vurderer handlingen.", 0],
          ["Hva menes med ‘perceived behavioural control’ i Ajzens modell?", "Hvor enkelt eller komplisert individet vurderer det entreprenørielle prosjektet å være.", ["Markedets kontroll over prisene på en vare.", "Evnen til å kontrollere ansatte i en stor organisasjon.", "Myndighetenes kontroll over det private næringsliv."], "Opplevd atferdskontroll er hvor lett eller vanskelig man tror det er å gjennomføre handlingen.", 0]
        ] },

      { id: 'ent-identitet', s: 'ent', t: 'individ', n: 'Identitet',
        x: 'Weick (1995) definerer identitet som en persons følelse av hvem han eller hun er i en gitt setting. Entreprenører har multiple identiteter: de er samtidig for eksempel forelder, student eller arbeidstaker.',
        fq: [
          ["Hva menes med at entreprenøren har ‘multiple identiteter’?", "Individet er ikke bare entreprenør, men også for eksempel forelder eller student samtidig.", ["At de eier mange selskaper med forskjellige navn.", "At de har flere personligheter i medisinsk forstand.", "At de ofte bruker falske navn for å skjule identiteten sin."], "Entreprenørrollen er én av flere roller samme person har, og de ulike identitetene påvirker hverandre.", 0],
          ["Hvordan definerer Weick (1995) ‘identitet’ i en organisatorisk setting?", "En persons følelse av hvem han eller hun er i en gitt setting.", ["En tittel man får tildelt av en overordnet leder.", "Et sett med faste verdier man får gjennom arv.", "Det juridiske navnet på en virksomhet."], "Weick ser identitet som personens egen forståelse av hvem hun eller han er i en bestemt situasjon.", 0]
        ] },

      { id: 'ent-fayolle', s: 'ent', t: 'individ', n: 'Fayolles prosessmodell',
        x: 'Fayolle (2003) beskriver individets vei mot entreprenørskap i stadier: fra indifferens, via oppvåkning der interessen vekkes av en hendelse eller påvirkning, til beslutningen om å handle og resultatene av handlingen.',
        fq: [
          ["Hva er det første stadiet i Fayolles (2003) modell for den individuelle prosessen mot entreprenørskap?", "Indifferens (Indifference).", ["Oppvåkning (Awakening).", "Beslutning om å handle (Decision to act).", "Resultater av handling (Results of action)."], "Prosessen starter med indifferens, der entreprenørskap ikke er aktuelt. Deretter kommer oppvåkning, beslutning og resultater.", 0],
          ["Hva skjer i fasen ‘Oppvåkning’ (Awakening) i Fayolles modell?", "Individets interesse for entreprenørskap blir stimulert av en hendelse eller påvirkning.", ["Man får sitt første lån utbetalt fra banken.", "Man oppdager at bedriften har gått konkurs.", "Entreprenøren våkner tidlig om morgenen for å jobbe."], "I oppvåkningsfasen vekkes interessen for entreprenørskap, for eksempel av en hendelse, en rollemodell eller en endring i livet.", 0]
        ] },

      { id: 'ent-intra', s: 'ent', t: 'sammenhenger', n: 'Intraprenørskap',
        x: 'Intraprenørskap er entreprenørskap i eksisterende organisasjoner. Et sentralt paradoks er om initiativene kommer ovenfra (top-down) eller nedenfra (bottom-up). Inkrementell intraprenørskap er gradvis fornyelse, mens radikal intraprenørskap gir helt nye muligheter. Burgelman (1983) viste at administrative mekanismer sørger for at ansatte følger den planlagte strategien.',
        fq: [
          ["Hva er hovedfokuset i paradokset knyttet til intraprenørskap?", "Top-down eller bottom-up initiativ.", ["Intern eller ekstern finansiering.", "Produktinnovasjon eller prosessinnovasjon.", "Lokal eller global ekspansjon."], "Paradokset handler om nyskapingen styres av ledelsen ovenfra eller vokser fram fra de ansatte nedenfra.", 0],
          ["Hva kjennetegner ‘inkrementell’ intraprenørskap?", "Gradvis fornyelse av eksisterende produkter og prosesser.", ["Nedleggelse av ulønnsomme avdelinger.", "Radikale hopp og helt nye markedsmuligheter.", "Opprettelse av helt uavhengige datterselskaper."], "Inkrementell intraprenørskap er små, gradvise forbedringer. Radikale hopp er det motsatte.", 0],
          ["Ifølge Burgelman (1983), hva sikrer at ansatte følger ledelsens planlagte strategi?", "Administrative mekanismer.", ["Politiske mekanismer.", "Kreativ destruksjon.", "Uformelle nettverk."], "Burgelman skilte mellom indusert strategisk atferd, som styres av administrative mekanismer, og autonom atferd, som vokser fram nedenfra.", 0]
        ] },

      { id: 'ent-sosialt', s: 'ent', t: 'sammenhenger', n: 'Sosialt entreprenørskap',
        x: 'Sosiale entreprenører har en sosial misjon. Modellene spenner fra rene non-profit-modeller til kommersielle modeller, og en risiko er ‘mission drift’, at det kommersielle tar over. Man skiller mellom sosiale bricoleurer (lokale problemer, tilgjengelige ressurser), sosiale konstruksjonister (skalerbare reformer der markedet svikter) og sosiale ingeniører (revolusjonerende endring). Den tredelte bunnlinjen måler økonomi, miljø og sosial rettferdighet.',
        fq: [
          ["I det sosiale entreprenørskapsfeltet, hva er hovedmålet for en ‘pure non-profit model’?", "Å generere sosial verdi uten kommersielle aktiviteter.", ["Å utvikle ny teknologi for militæret.", "Å konkurrere ut alle private bedrifter.", "Å skape profitt for å dele ut utbytte."], "En ren non-profit-modell skaper sosial verdi uten å drive kommersiell virksomhet.", 0],
          ["Hva er den primære sosiale misjonen for en ‘Social Constructionist’?", "Å utnytte markedssvikt ved å introdusere skalerbare reformer i sosiale systemer.", ["Å skape revolusjonerende endringer på globalt politisk nivå.", "Å løse små, lokale problemer med begrensede ressurser.", "Å maksimere profitt for å donere alt til veldedighet."], "Sosiale konstruksjonister fyller hull der markedet og det offentlige svikter, med løsninger som kan skaleres. Lokale problemer er bricoleurens område, revolusjonerende endring ingeniørens.", 0],
          ["Hva menes med begrepet ‘mission drift’ i sosialt entreprenørskap?", "At organisasjonen mister sitt sosiale fokus til fordel for kommersielle mål.", ["At bedriften ekspanderer til for mange land samtidig.", "At ansatte bytter jobb for ofte.", "At sosiale entreprenører samarbeider for mye med det offentlige."], "Mission drift skjer når hensynet til inntekter gradvis presser ut den sosiale misjonen.", 0],
          ["Hvilke tre elementer inngår i konseptet ‘den tredelte bunnlinjen’ (Triple Bottom Line)?", "Økonomisk inntjening, miljømessig bærekraft og sosial rettferdighet.", ["Vekst, markedsandel og aksjekurs.", "Produksjon, markedsføring og salg.", "Innovasjon, teknologi og effektivitet."], "Den tredelte bunnlinjen måler resultater på tre områder: økonomi, miljø og samfunn.", 0],
          ["Hvilket av følgende er et eksempel på ‘Social Bricolage’?", "Å løse et lokalt problem ved å bruke de ressursene som er tilgjengelige der og da.", ["Å lobbyere for nye lover i EU.", "Å starte et globalt legemiddelfirma.", "Å selge luksusbiler til de rike."], "Sosial bricolage betyr å løse lokale problemer med de ressursene man har for hånden.", 0]
        ] },

      { id: 'ent-offentlig', s: 'ent', t: 'sammenhenger', n: 'Offentlig entreprenørskap',
        x: 'Offentlig entreprenørskap kan være lukket, drevet internt av offentlig ansatte og ledere, eller åpent, gjennom samarbeid og samskaping med borgere og andre sektorer. New Public Management ser borgerne som kunder, mens New Public Governance ser dem som medprodusenter. En sentral spenning er mellom entreprenøriell risiko og demokratisk ansvarlighet. Policy-entreprenører påvirker den politiske dagsordenen.',
        fq: [
          ["I paradokset for offentlig entreprenørskap, hva kjennetegner det ‘lukkede’ perspektivet?", "At aktiviteter drives internt av offentlig ansatte og ledere.", ["At innovasjon skjer i tette nettverk med private aktører.", "At alle budsjetter er hemmelige for offentligheten.", "At borgerne får stemme over alle nye prosjekter."], "I det lukkede perspektivet skjer fornyelsen innenfor offentlig sektor, drevet av egne ansatte og ledere.", 0],
          ["Hva er den største spenningen i ‘offentlig entreprenørskap vs. demokrati’?", "Balansen mellom entreprenøriell risiko og demokratisk ansvarlighet.", ["At politikerne ikke forstår teknologi.", "At entreprenører tjener for lite penger.", "At det tar for lang tid å stemme."], "Entreprenørskap innebærer risiko og eksperimentering, mens offentlige midler krever åpenhet og demokratisk ansvarlighet.", 0],
          ["Hva innebærer det ‘åpne’ perspektivet på offentlig entreprenørskap?", "Samarbeid og samskaping på tvers av sektorer og med borgere.", ["At staten skal kjøpe opp alle private bedrifter.", "At alle dører i rådhuset skal stå fysisk åpne.", "At entreprenøren må dele alle sine forretningshemmeligheter."], "I det åpne perspektivet skapes fornyelsen sammen med borgere, frivillige og private aktører.", 0],
          ["Hva skiller ‘New Public Governance’ (NPG) fra ‘New Public Management’ (NPM)?", "NPM ser på borgere som kunder, mens NPG ser på dem som medprodusenter.", ["NPM ble avviklet etter 1970-tallet.", "Det er ingen praktisk forskjell på de to begrepene.", "NPG fokuserer på internt hierarki og kontroll."], "NPM hentet ideer fra markedet og så borgerne som kunder. NPG vektlegger samarbeid og ser borgerne som medprodusenter.", 0],
          ["Hva er en ‘Policy Entrepreneur’ i offentlig sektor?", "En person utenfor regjeringen som påvirker dagsordenen.", ["En folkevalgt politiker med lederansvar.", "En ansatt i skatteetaten som foreslår nye skjemaer.", "En profesjonell lobbyist betalt av et privat firma."], "En policy-entreprenør bruker tid og ressurser på å få en sak på den politiske dagsordenen, og kan virke utenfor de formelle posisjonene.", 0]
        ] },

      { id: 'ent-politikk', s: 'ent', t: 'sammenhenger', n: 'Entreprenørskapspolitikk',
        x: 'Politikk for entreprenørskap begrunnes ofte med markedssvikt, at markedet alene ikke dekker visse behov. Et velstandsperspektiv vil øke BNP og skape arbeidsplasser, mens et inkluderingsperspektiv retter seg mot ‘3D-ene’: grupper som er vanskeligstilte, frakoblet og motløse. Nye bedrifter møter ‘liability of newness’.',
        fq: [
          ["Hva refererer ‘3D-ene’ til i entreprenørskapspolitikk (disadvantaged, disconnected, discouraged)?", "Sosialt utsatte og marginaliserte grupper.", ["Tre typer digitale plattformer.", "Tre faser i en konkurs.", "Design, Digitalisering og Distribusjon."], "De tre D-ene beskriver grupper som er vanskeligstilte, frakoblet og motløse, og som politikken vil inkludere gjennom entreprenørskap.", 0],
          ["Hvorfor er ‘market failure’ (markedssvikt) en vanlig begrunnelse for politisk intervensjon?", "Fordi visse behov ikke dekkes av det frie markedet alene.", ["Fordi det hindrer monopoler i å oppstå.", "Fordi det reduserer skattetrykket for bedrifter.", "Fordi markedet alltid er mer effektivt enn staten."], "Når markedet ikke dekker et behov, for eksempel finansiering i tidlig fase, kan det offentlige gripe inn.", 0],
          ["Hva er hovedformålet med entreprenørskapspolitikk sett fra et ‘velstandsperspektiv’ (Wealth)?", "Å øke BNP og skape arbeidsplasser gjennom økonomisk vekst.", ["Å nasjonalisere alle teknologiske oppfinnelser.", "Å inkludere marginaliserte grupper i arbeidsmarkedet.", "Å redusere antall nye bedrifter for å unngå konkurranse."], "Velstandsperspektivet handler om vekst og arbeidsplasser. Å inkludere marginaliserte grupper hører til inkluderingsperspektivet.", 0],
          ["Hva er ‘liability of newness’ i sammenheng med offentlig støtte til gründere?", "At nye bedrifter mangler legitimitet og rutiner, noe som øker risikoen for å feile.", ["At unge gründere ikke har lov til å låne penger.", "At det er ulovlig å starte en bedrift uten lisens.", "At nye bedrifter er lovpålagt å betale mer skatt."], "Nye bedrifter har ikke etablerte rutiner, relasjoner eller omdømme, og feiler derfor oftere. Det er en begrunnelse for offentlig støtte.", 0]
        ] },

      { id: 'ent-tek', s: 'ent', t: 'sammenhenger', n: 'Teknologisk entreprenørskap',
        x: 'I teknologisk entreprenørskap er et sentralt paradoks om teknologien eller markedet skal styre. Lean Startup-metodikken vektlegger rask prototyping og læring gjennom tilbakemeldinger fra kunder.',
        fq: [
          ["Hva er ‘Lean Startup’-metodikkens viktigste bidrag til teknologisk entreprenørskap?", "Rask prototyping og kontinuerlig læring gjennom kundetilbakemeldinger.", ["Å patentere alle ideer før man snakker med kunder.", "Å skrive en 100-siders forretningsplan før start.", "Å låne så mye penger som mulig fra banken med en gang."], "Lean Startup handler om å teste enkle versjoner tidlig, lære av kundene og justere raskt.", 0],
          ["Hva innebærer paradokset ‘Teknologi eller marked’ i teknologisk entreprenørskap?", "Om man skal fokusere på teknisk overlegenhet eller kundenes faktiske behov.", ["Valget mellom å bruke PC eller Mac.", "Hvorvidt man skal selge produktene på internett eller i butikk.", "Om man skal ansette ingeniører eller selgere."], "Paradokset handler om utviklingen skal drives av hva teknologien kan, eller av hva kundene faktisk trenger.", 0]
        ] },

      { id: 'ent-paradoks', s: 'ent', t: 'sammenhenger', n: 'Objektivisme og subjektivisme',
        x: 'Bokens meta-paradoks er objektivistisk mot subjektivistisk tilnærming. Det objektivistiske synet ser muligheter som noe som finnes der ute og må oppdages. Det subjektivistiske synet mener at muligheter skapes gjennom menneskelig samhandling og tolkning.',
        fq: [
          ["Hva kjennetegner det ‘subjektivistiske’ perspektivet i entreprenørskap?", "At muligheter skapes gjennom menneskelig samhandling og tolkning.", ["At man bare skal stole på statistikk og data.", "At verden er fylt med objektive muligheter som bare må finnes.", "At ledelsen alltid har rett."], "Det subjektivistiske synet ser muligheter som noe mennesker skaper sammen. Objektive muligheter som bare må finnes, er det objektivistiske synet.", 0],
          ["Hvilket begrep brukes om entreprenørskapets ‘meta-paradoks’ i bokens avslutning?", "Objektivistisk vs. Subjektivistisk tilnærming.", ["Teknisk vs. Praktisk.", "Rik vs. Fattig.", "Mannlig vs. Kvinnelig entreprenørskap."], "Meta-paradokset går igjen i hele boken: er muligheter objektive og oppdages, eller subjektive og skapes?", 0]
        ] },

      { id: 'ent-idemulighet', s: 'ent', t: 'muligheter', n: 'Idé og mulighet',
        x: 'En idé blir en entreprenøriell mulighet når den er vurdert til å kunne skape verdi for andre og realiseres i et marked. Selv om en mulighet kan være objektiv, er det subjektivt hvem som ser den: tidligere erfaring, kunnskap og nettverk avgjør.',
        fq: [
          ["Hva er den avgjørende forskjellen mellom en idé og en entreprenøriell mulighet i følge boken?", "En mulighet er en idé som er evaluert til å kunne skape verdi for andre og realiseres i et marked.", ["En mulighet er alltid basert på en ny teknologisk oppfinnelse, mens en idé kan være hva som helst.", "En idé er alltid teoretisk, mens en mulighet krever at man allerede har startet en bedrift.", "En idé er privat, mens en mulighet må være offentlig kjent for å ha verdi."], "En idé blir en mulighet når den er vurdert til å kunne skape verdi for andre og kan realiseres.", 0],
          ["Hva menes med at oppdagelse av muligheter er en ‘subjektiv prosess’ selv om muligheten kan være objektiv?", "At individets tidligere erfaring og kunnskap avgjør om de klarer å se muligheten.", ["At følelser er viktigere enn fakta når man skal starte bedrift.", "At muligheten bare finnes inne i hodet på gründeren.", "At alle kan se den samme muligheten hvis de bare får nok informasjon."], "Muligheten kan finnes uavhengig av individet, men det er erfaring og kunnskap som avgjør hvem som ser den.", 0],
          ["Hvilken rolle spiller sosiale nettverk i mulighets-oppdagelse i følge Shane (2003)?", "De gir tilgang til unik informasjon som er avgjørende for å se nye muligheter.", ["De er bare viktige for å få moralsk støtte fra venner og familie.", "Nettverk har ingen betydning før bedriften er formelt registrert.", "De bør unngås for å holde ideen hemmelig så lenge som mulig."], "Ifølge Shane gir nettverk tilgang til informasjon andre ikke har, og det er ofte det som gjør at man ser en mulighet.", 0]
        ] },

      { id: 'ent-kirzner', s: 'ent', t: 'muligheter', n: 'Kirzner, Schumpeter og årvåkenhet',
        x: 'En kirznersk mulighet utnytter eksisterende prisforskjeller og bringer markedet mot likevekt. En schumpetersk mulighet skaper ubalanse gjennom radikal innovasjon. Årvåkenhet er evnen til å legge merke til muligheter andre har oversett, uten aktivt søk.',
        fq: [
          ["Hva innebærer begrepet ‘alertness’ (årvåkenhet) i entreprenørskapslitteraturen?", "Evnen til å legge merke til muligheter som hittil har blitt oversett, uten aktivt søk.", ["Prosessen med å skaffe kapital fra investorer før en idé er testet.", "Evnen til å planlegge den entreprenørielle prosessen fem år frem i tid.", "En systematisk metode for å analysere konkurrenter i et etablert marked."], "Kirzners årvåkenhet er en evne til å se muligheter andre har oversett, uten systematisk leting.", 0],
          ["Hvilket av følgende kjennetegner en Schumpeteriansk mulighet?", "Den skaper ubalanse i markedet gjennom radikal innovasjon og ‘kreativ destruksjon’.", ["Den baserer seg utelukkende på å gjøre eksisterende prosesser billigere og mer effektive.", "Den bidrar til å bringe markedet tilbake til likevekt ved å fylle eksisterende behov.", "Den krever ingen kreativitet fra individet, kun tilgang til informasjon."], "Schumpeterske muligheter bryter likevekten med noe nytt. Å bringe markedet mot likevekt er typisk for kirznerske muligheter.", 0],

  // ---------- Scenariogeneratorer ----------
  // Hver generator er en liste med rammer. En ramme tar inn tilfeldige navn, virksomhet og tall (x) og
  // returnerer { t: scenario, e: forklaring }. Scenarioene skal ikke inneholde ord som avslører svaret.
  buildGen() {
    const pairs = (P, make) => P.map((p) => (x) => make(p, x));
    const ctx = (x) => this.fill(x.r(this.ARGCTX), x);
    const sirkelE = 'Konklusjonen er allerede bygget inn i begrunnelsen. Argumentet forutsetter det det skal bevise, så det gir ingen selvstendig grunn til å tro på påstanden.';
    return {
      bekr: [
        (x) => { const pos = x.r([12, 18, 25]), neg = x.r([40, 60, 85]); return {
          t: `${x.n} har lansert en ny kampanje for ${x.b} og er sikker på at den virker. ${x.n} leser nøye gjennom de ${pos} positive kommentarene på sosiale medier, men avfeier de ${neg} negative som «folk som alltid klager».`,
          e: `${x.n} legger stor vekt på det som støtter troen på kampanjen, og avviser det som taler imot, selv om de negative kommentarene er flest.` }; },
        (x) => { const f = x.r(['et batteriselskap', 'en sjømatprodusent', 'et spillselskap', 'et rederi', 'en strømmetjeneste']); return {
          t: `${x.n} har kjøpt aksjer i ${f} og tror kursen skal opp. Når ${x.n} leter etter analyser, søker ${x.n} på «${x.r(['kjøpsanbefaling', 'kursmål opp', 'undervurdert aksje'])}» og leser bare dem som anbefaler kjøp.`,
          e: `${x.n} søker bare etter informasjon som kan støtte det ${x.n} allerede tror, og ser aldri etter grunner til at kursen kan falle.` }; },
        (x) => ({
          t: `${x.n} er leder i ${x.b} og fikk et dårlig førsteinntrykk av den nyansatte ${x.n2}. De neste ${x.r(['ukene', 'månedene'])} legger ${x.n} merke til hver feil ${x.n2} gjør, mens de gode leveransene knapt blir nevnt i medarbeidersamtalen.`,
          e: `Førsteinntrykket styrer hva ${x.n} legger merke til: feil som passer med inntrykket, huskes, mens det som taler imot, overses.` }),
        (x) => { const ide = x.r(['en app for deling av studentbøker', 'et abonnement på sunne matpakker', 'en tjeneste for utleie av verktøy', 'en nettbutikk for brukte sportsklær', 'en plattform for studentjobber']), k = x.r([5, 6, 8, 10]); return {
          t: `${x.n} vil finne ut om det er marked for ${ide}. ${x.n} spør ${k} venner som tidligere har sagt at idéen er genial, og konkluderer med at markedet er stort.`,
          e: `${x.n} velger ut kilder som på forhånd støtter idéen. En reell test ville spurt folk som kunne si nei, og lett etter grunner til at idéen ikke virker.` }; },
        (x) => { const k = x.r([140, 230, 380, 520]); return {
          t: `${x.n} tror at kunder som får nyhetsbrevet til ${x.b}, handler mer. For å sjekke det ser ${x.n} bare på kunder som både fikk nyhetsbrevet og handlet, og finner ${k} slike. «Der har vi beviset», sier ${x.n}.`,
          e: `${x.n} ser bare på tilfellene som passer med hypotesen. For å teste den måtte ${x.n} også sett på kunder som fikk brevet uten å handle, og kunder som handlet uten brev.` }; },
        (x) => ({
          t: `To ledere i ${x.b} leser den samme medarbeiderundersøkelsen etter en omorganisering. ${x.n}, som gikk inn for endringen, mener tallene viser at den virker. ${x.n2}, som var imot, mener de samme tallene viser at den har mislyktes.`,
          e: 'Begge tolker de samme tvetydige tallene i lys av det de mente fra før. Det de allerede tror, avgjør hvordan dataene leses.' }),
        (x) => { const g = x.r([['den samme genseren', 'den'], ['den samme pennen', 'den'], ['det samme armbåndet', 'det']]); return {
          t: `${x.n} har alltid med ${g[0]} på eksamen og er overbevist om at ${g[1]} gir flaks. ${x.n} husker godt eksamenene som gikk bra, men har glemt de ${x.r(['to', 'tre'])} som gikk dårlig.`,
          e: `${x.n} husker tilfellene som passer med troen og glemmer dem som ikke gjør det. Slik ser det ut som om det finnes et mønster.` }; }
      ],
      tilgj: [
        (x) => { const d = x.r([450, 520, 640, 780]), sted = x.r(['Bergen', 'Trondheim', 'Stavanger', 'Kristiansand']); return {
          t: `Etter en uke med nyhetssaker om et flystyrt i utlandet bestemmer ${x.n} seg for å kjøre bil ${d} km til ${sted} i stedet for å fly. Flyreiser føles plutselig mye farligere.`,
          e: `De dramatiske nyhetene er ferske og lette å komme på, så ${x.n} overvurderer risikoen ved å fly. Per kilometer er bilkjøring langt farligere.` }; },
        (x) => { const k = x.r([20, 25, 30]), k2 = x.r([1, 2, 3]); return {
          t: `En nabo forteller ${x.n} en dramatisk historie om et innbrudd i gata. Etterpå anslår ${x.n} at ${k} av 100 hus i området har hatt innbrudd det siste året. Politiets tall viser ${k2} av 100.`,
          e: `Én levende historie gjør innbrudd lett å se for seg, og ${x.n} bruker det som mål på hvor vanlig det er.` }; },
        (x) => ({
          t: `${x.n} har lest flere saker om unge som har blitt millionærer på ${x.r(['kryptovaluta', 'aksjehandel på mobilen', 'egne nettbutikker'])}. ${x.n} konkluderer med at de fleste som prøver seg, tjener godt.`,
          e: 'Suksesshistoriene er lette å komme på fordi de får mye omtale. De mange som tapte penger, skriver ingen nyhetssaker om.' }),
        (x) => ({
          t: `I den årlige medarbeidersamtalen vurderer ${x.n} at ${x.n2} har vært lite pålitelig det siste året. Grunnen er en pinlig feil ${x.n2} gjorde foran en stor kunde forrige uke, som ${x.n} husker godt.`,
          e: 'Den ferske og pinlige episoden er lett å komme på, og får styre vurderingen av et helt år.' }),
        (x) => { const a = x.r(['mygg', 'bier og veps', 'slanger']); return {
          t: `Etter å ha sett en dokumentar om haiangrep tror ${x.n} at hai dreper flere mennesker i verden hvert år enn ${a} gjør.`,
          e: `Haiangrep er dramatiske og lette å se for seg. ${this.uc(a)} dreper langt flere hvert år, men det blir det sjelden laget dokumentarer om.` }; },
        (x) => ({
          t: `En konkurrent av ${x.b} ble nylig rammet av et mye omtalt dataangrep. Ledelsen bruker derfor hele sikkerhetsbudsjettet på IT, selv om ${x.r(['brann og vannskader', 'tyveri og innbrudd', 'arbeidsulykker'])} er langt vanligere i bransjen.`,
          e: 'Det omtalte dataangrepet er friskt i minnet og virker derfor mer sannsynlig enn risikoer som er vanligere, men mindre omtalt.' })
      ],
      forank: [
        (x) => { const mid = x.r([520, 540, 560, 580]) * 1000, low = mid - x.r([60, 80, 100]) * 1000, end = low + x.r([20, 30]) * 1000; return {
          t: `${x.n} skal forhandle lønn i ${x.b} og har tenkt å be om ${x.kr(mid)}. Helt i starten nevner arbeidsgiveren at «noen nyutdannede starter på ${x.kr(low)}». ${x.n} ender med å be om ${x.kr(end)}.`,
          e: `Det første tallet arbeidsgiveren nevnte, trakk forventningene til ${x.n} nedover, selv om det ikke sa noe om hva ${x.n} er verdt.` }; },
        (x) => { const lo = x.r([3.9, 4.2, 4.5]), hi = lo + x.r([0.8, 1, 1.2]); return {
          t: `To grupper med eiendomsmeglere vurderer den samme leiligheten. Den ene gruppen får vite at prisantydningen er ${x.nf(lo)} millioner kr, den andre at den er ${x.nf(hi)} millioner kr. Gruppen med den høye prisantydningen anslår at leiligheten er verdt klart mer.`,
          e: 'Prisantydningen blir et utgangspunkt som meglerne justerer for lite bort fra, selv om de vurderer nøyaktig samme leilighet.' }; },
        (x) => { const org = x.r(['en stor offentlig etat', 'landets største sykehus', 'en stor bank', 'et stort universitet']); return {
          t: `Før et quizspørsmål om hvor mange ansatte ${org} har, ber kursholderen alle skrive ned de to siste sifrene i mobilnummeret sitt. Deltakerne med høye sifre gjetter systematisk høyere enn dem med lave.`,
          e: 'Selv et tall alle vet er tilfeldig, påvirker anslagene. Det viser hvor sterkt et utgangspunkt kan styre en vurdering.' }; },
        (x) => { const it = x.r(['en jakke', 'et par joggesko', 'en ryggsekk', 'en kaffemaskin']), now = x.r([899, 1199, 1499, 1999]), old = Math.round((now * x.r([1.8, 2, 2.2])) / 100) * 100 - 1; return {
          t: `En nettbutikk selger ${it} med prisen «Før ${x.kr(old)}, nå ${x.kr(now)}». ${x.n} synes ${x.kr(now)} er et kupp, selv om tilsvarende varer koster rundt ${x.kr(now)} i andre butikker.`,
          e: `Førprisen gjør at ${x.kr(now)} virker billig. ${x.n} sammenligner med tallet butikken viste først, ikke med hva varen faktisk er verdt.` }; },
        (x) => { const s = x.r([1.2, 1.5, 2, 2.5]), e2 = s - x.r([0.1, 0.2]); return {
          t: `I budsjettmøtet i ${x.b} foreslår den første som tar ordet, ${x.nf(s)} millioner kr til markedsføring, uten noen begrunnelse. Etter en lang diskusjon lander ledergruppen på ${x.nf(e2)} millioner kr.`,
          e: 'Det første tallet styrte hele diskusjonen, selv om ingen kunne begrunne det. Alle justerte ut fra det i stedet for å starte med behovet.' }; },
        (x) => { const w = x.r([30, 36, 40]), w2 = w - x.r([4, 6]), v = x.r([6, 8]), v2 = v + x.r([1, 2]); return {
          t: `En prosjektleder i ${x.b} spør teamet: «Blir dette ferdig på mer eller mindre enn ${w} uker?» Teamet anslår ${w2} uker. Et annet team, som får spørsmålet med ${v} uker, anslår ${v2} uker for den samme jobben.`,
          e: 'Tallet i spørsmålet ble et utgangspunkt som styrte anslagene, selv om det ikke bygde på noen analyse. Derfor havnet de to teamene så langt fra hverandre.' }; }
      ],
      grunn: [
        (x) => { const syk = x.r(['en sjelden hudsykdom', 'en arvelig stoffskiftesykdom', 'en sjelden allergi', 'en sjelden blodsykdom']), s = x.r([90, 95, 99]), f = x.r([5, 8, 10]), b = x.r([1, 2, 4]);
          const tp = (b * s) / 100, fp = ((1000 - b) * f) / 100, post = Math.round((100 * tp) / (tp + fp));
          return {
            t: `En hurtigtest for ${syk} oppdager ${s} % av dem som er syke, men gir også positivt svar hos ${f} % av de friske. ${b} av 1 000 i befolkningen har sykdommen. ${x.n} tester positivt og regner med at det er ${s} % sannsynlig at ${x.n} er syk.`,
