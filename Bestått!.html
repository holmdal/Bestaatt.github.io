      const v = r([{ w: 'Et bakeri', u: 'brød' }, { w: 'Et sagbruk', u: 'planker' }, { w: 'Et regnskapsbyrå', u: 'bilag' }, { w: 'En sykkelfabrikk', u: 'sykler' }]);
      let p1, g, H1, hf, H2, Q1, Q2, tot, hch;
      do {
        p1 = r([20, 25, 40, 50]); g = r([10, 20, 25, -10]); H1 = r([400, 500, 800]); hf = r([1.25, 0.8, 1.5]);
        H2 = H1 * hf; Q1 = p1 * H1; Q2 = Math.round(p1 * (1 + g / 100) * H2);
        tot = Math.round((Q2 / Q1 - 1) * 100); hch = Math.round((hf - 1) * 100);
      } while (!this.distinct([g, tot, hch, -g]));
      const ch = (x) => (x >= 0 ? 'Økte med ' + x + ' %' : 'Falt med ' + Math.abs(x) + ' %');
      return {
        stem: v.w + ' produserte ' + this.nf(Q1) + ' ' + v.u + ' med ' + this.nf(H1) + ' arbeidstimer i fjor, og ' + this.nf(Q2) + ' ' + v.u + ' med ' + this.nf(H2) + ' arbeidstimer i år. Hvordan endret arbeidsproduktiviteten seg?',
        options: [
          { text: ch(g), correct: true, why: '' },
          { text: ch(tot), correct: false, why: 'Det er endringen i total produksjon. Produktiviteten er produksjon per arbeidstime.' },
          { text: ch(hch), correct: false, why: 'Det er endringen i antall arbeidstimer, ikke i produksjon per time.' },
          { text: ch(-g), correct: false, why: 'Du har fått fortegnet feil vei. Sammenlign produksjon per time i fjor og i år.' }
        ],
        explain: 'I fjor: ' + this.nf(Q1) + ' / ' + this.nf(H1) + ' = ' + this.nf(p1) + ' ' + v.u + ' per time. I år: ' + this.nf(Q2) + ' / ' + this.nf(H2) + ' = ' + this.nf(Q2 / H2) + ' per time. Det er en endring på ' + g + ' %.'
      };
    }
    if (kind === 'tekn') {
      let w, m, cA, cB;
      do { w = r([800, 1000, 1200, 1500, 1800, 2200]); m = r([1000, 1500, 2000, 2500, 3000]); cA = 6 * w + m; cB = 2 * w + 3 * m; } while (Math.abs(cA - cB) < 500);
      const aBest = cA < cB;
      return {
        stem: 'En bedrift kan lage samme mengde med teknologi A (6 arbeidere og 1 maskin per dag) eller teknologi B (2 arbeidere og 3 maskiner per dag). En arbeider koster ' + this.kr(w) + ' per dag, og en maskin koster ' + this.kr(m) + ' per dag. Hvilken teknologi bør bedriften velge?',
        options: [
          { text: 'A, som koster ' + this.kr(cA) + ' per dag', correct: aBest, why: 'A koster ' + this.kr(cA) + ', mens B koster ' + this.kr(cB) + '. B er billigst.' },
          { text: 'B, som koster ' + this.kr(cB) + ' per dag', correct: !aBest, why: 'B koster ' + this.kr(cB) + ', mens A koster ' + this.kr(cA) + '. A er billigst.' },
          { text: 'A, fordi den bruker færrest maskiner', correct: false, why: 'Antallet maskiner avgjør ikke alene. Det er totalkostnaden ved prisene som gjelder.' },
          { text: 'B, fordi maskiner alltid er mest effektive', correct: false, why: 'Maskiner lønner seg bare når de gir lavere kostnad ved de prisene som gjelder.' }
        ],
        explain: 'A: 6 × ' + this.kr(w) + ' + 1 × ' + this.kr(m) + ' = ' + this.kr(cA) + '. B: 2 × ' + this.kr(w) + ' + 3 × ' + this.kr(m) + ' = ' + this.kr(cB) + '. ' + (aBest ? 'A' : 'B') + ' er billigst. Stiger lønnen nok i forhold til maskinprisen, blir B billigst.'
      };
    }
    if (kind === 'jobbrente') {
      let W, D, M;
      do { W = r([36, 40, 45, 50, 55]) * 1000; D = r([18, 20, 22, 25]) * 1000; M = r([3, 4, 6, 8]); } while (!this.distinct([(W - D) * M, W * M, D * M, W - D]));
      return {
        stem: cx.n + ' tjener ' + this.kr(W) + ' i måneden. Mister ' + cx.n + ' jobben, tar det i snitt ' + M + ' måneder å finne en ny, og i mellomtiden har ' + cx.n + ' dagpenger og annen verdi tilsvarende ' + this.kr(D) + ' i måneden. Hvor stor er jobbrenten, regnet over hele ledighetsperioden?',
        options: [
          { text: this.kr((W - D) * M), correct: true, why: '' },
          { text: this.kr(W * M), correct: false, why: 'Det er hele lønnen i perioden. Verdien av alternativet (dagpenger og annet) må trekkes fra.' },
          { text: this.kr(D * M), correct: false, why: 'Det er verdien av alternativet, ikke hvor mye bedre jobben er.' },
          { text: this.kr(W - D), correct: false, why: 'Det er tapet per måned. Det må ganges med antall måneder uten jobb.' }
        ],
        explain: 'Jobbrenten er forskjellen mellom jobben og det beste alternativet: (' + this.kr(W) + ' − ' + this.kr(D) + ') × ' + M + ' = ' + this.kr((W - D) * M) + '.'
      };
    }
    if (kind === 'markup') {
      let e, k, GK, P;
      do { e = r([2, 3, 4, 5, 6]); k = r([10, 15, 20, 25, 30, 40, 50, 60]); GK = k * (e - 1); P = k * e; } while (!this.distinct([P, GK, Math.round(GK * (1 + 1 / e) * 10) / 10, GK * e]));
      return {
        stem: 'En bedrift med et differensiert produkt har en grensekostnad på ' + this.kr(GK) + ', og priselastisiteten er −' + e + '. Hvilken pris maksimerer profitten?',
        options: [
          { text: this.kr(P), correct: true, why: '' },
          { text: this.kr(GK), correct: false, why: 'Pris lik grensekostnad er tilpasningen under fullkommen konkurranse. Med markedsmakt settes prisen over.' },
          { text: this.kr(GK * (1 + 1 / e)), correct: false, why: 'Påslaget regnes som andel av prisen, ikke av kostnaden: (P − GK) / P = 1 / ' + e + '.' },
          { text: this.kr(GK * e), correct: false, why: 'Prisen er ikke grensekostnaden ganget med elastisiteten. Bruk (P − GK) / P = 1 / |e|.' }
        ],
        explain: 'Påslaget (P − GK) / P = 1 / ' + e + '. Det gir P = GK · ' + e + ' / ' + (e - 1) + ' = ' + this.kr(GK) + ' · ' + e + ' / ' + (e - 1) + ' = ' + this.kr(P) + '.'
      };
    }
    if (kind === 'gap') {
      const Yp = r([3000, 3200, 3500, 4000, 4500, 5000]), g = r([-3, -2.5, -2, -1.5, -1, 1, 1.5, 2, 2.5, 3]), Y = Math.round(Yp * (1 + g / 100));
      const fmt = (x) => (x > 0 ? '+' : '−') + this.nf(Math.abs(x)) + ' %';
      const ph = (x) => (x > 0 ? 'høykonjunktur' : 'lavkonjunktur');
      return {
        stem: 'Potensielt BNP, det økonomien kan produsere ved normal ressursbruk, er ' + this.nf(Yp) + ' milliarder kr. Faktisk BNP er ' + this.nf(Y) + ' milliarder kr. Hva er produksjonsgapet, og hva sier det?',
        options: [
          { text: fmt(g) + ', ' + ph(g), correct: true, why: '' },
          { text: fmt(-g) + ', ' + ph(-g), correct: false, why: 'Fortegnet er snudd. Gapet er (faktisk − potensielt) / potensielt.' },
          { text: fmt(g) + ', ' + ph(-g), correct: false, why: 'Tallet stemmer, men tolkningen er feil. ' + (g > 0 ? 'Produksjon over normalt er høykonjunktur.' : 'Produksjon under normalt er lavkonjunktur.') },
          { text: fmt(-g) + ', ' + ph(g), correct: false, why: 'Både fortegnet og tolkningen henger ikke sammen. Regn (faktisk − potensielt) / potensielt.' }
        ],
        explain: 'Produksjonsgapet er (' + this.nf(Y) + ' − ' + this.nf(Yp) + ') / ' + this.nf(Yp) + ' = ' + fmt(g) + '. ' + (g > 0 ? 'Produksjonen er over normalt nivå: høykonjunktur.' : 'Produksjonen er under normalt nivå: lavkonjunktur.')
      };
    }
    if (kind === 'infl') {
      let w, pi;
      do { w = r([2, 3, 4, 5, 6]); pi = r([1, 2, 3, 4, 5, 6, 7]); } while (w === pi || !this.distinct([w - pi, w + pi, w, pi - w]));
      const sg = (x) => (x > 0 ? '+' : '−') + Math.abs(x) + ' %';
      return {
        stem: cx.n + ' fikk ' + w + ' % lønnsøkning i fjor, mens prisene steg med ' + pi + ' %. Omtrent hvor mye endret reallønnen seg?',
        options: [
          { text: sg(w - pi), correct: true, why: '' },
          { text: sg(w + pi), correct: false, why: 'Prisveksten skal trekkes fra, ikke legges til. Høyere priser gjør at lønnen kjøper mindre.' },
          { text: sg(w), correct: false, why: 'Det er den nominelle lønnsveksten. Reallønnen justerer for prisveksten.' },
          { text: sg(pi - w), correct: false, why: 'Du har trukket fra i feil rekkefølge. Reallønnsvekst er omtrent lønnsvekst minus prisvekst.' }
        ],
        explain: 'Reallønnsveksten er omtrent nominell lønnsvekst minus prisvekst: ' + w + ' % − ' + pi + ' % = ' + sg(w - pi) + '. ' + (w < pi ? 'Lønnen kjøper mindre enn før.' : 'Lønnen kjøper litt mer enn før.')
      };
    }
    if (kind === 'multi') {
      const c = r([0.6, 0.75, 0.8, 0.9]), dG = r([1, 2, 3, 4, 5, 6, 8, 10, 12, 15]), m = 1 / (1 - c), mk = (x) => this.nf(x) + ' milliarder kr';
      return {
        stem: 'Den marginale konsumtilbøyeligheten er ' + this.nfd(c, 2) + '. Staten øker kjøpene sine med ' + dG + ' milliarder kr. Hvor mye øker BNP i den enkleste modellen, uten skatt og import?',
        options: [
          { text: mk(dG * m), correct: true, why: '' },
          { text: mk(dG * c), correct: false, why: 'Det er bare forbruksøkningen i andre runde. Multiplikatoren tar med alle rundene.' },
          { text: mk(dG), correct: false, why: 'Da har du sett bort fra at inntekten blir brukt videre i nye runder.' },
          { text: mk(dG / c), correct: false, why: 'Multiplikatoren er 1 / (1 − c), ikke 1 / c.' }
        ],
        explain: 'Multiplikatoren er 1 / (1 − ' + this.nfd(c, 2) + ') = ' + this.nf(m) + '. BNP øker med ' + dG + ' × ' + this.nf(m) + ' = ' + mk(dG * m) + '.'
      };
    }
    // likevekt
    const up = Math.random() < 0.5;
    const g = up ? r([{ v: 'jordbær', w: 'en uvanlig god sesong' }, { v: 'laks', w: 'nye oppdrettsanlegg' }, { v: 'solcellepaneler', w: 'billigere produksjon' }])
      : r([{ v: 'kakao', w: 'tørke i produksjonslandene' }, { v: 'egg', w: 'fugleinfluensa' }, { v: 'kaffe', w: 'frost i Brasil' }]);
    return {
      stem: 'Tilbudet av ' + g.v + ' ' + (up ? 'øker' : 'faller') + ' på grunn av ' + g.w + '. Etterspørselen er uendret. Hva skjer med likevekten?',
      options: [
        { text: 'Prisen faller, og omsatt mengde øker', correct: up, why: 'Når tilbudet faller, blir varen knappere. Da stiger prisen, og omsatt mengde faller.' },
        { text: 'Prisen stiger, og omsatt mengde faller', correct: !up, why: 'Når tilbudet øker, kommer det flere varer på markedet. Da faller prisen, og omsatt mengde øker.' },
        { text: 'Prisen faller, og omsatt mengde faller', correct: false, why: 'Når bare tilbudet endres, går pris og mengde i motsatt retning.' },
        { text: 'Prisen er uendret, fordi etterspørselen ikke endres', correct: false, why: 'Prisen endres fordi tilbudskurven flytter seg langs den uendrede etterspørselskurven.' }
      ],
      explain: up ? 'Tilbudskurven skifter ut. Langs den uendrede etterspørselskurven gir det lavere pris og høyere omsatt mengde.'
        : 'Tilbudskurven skifter inn. Langs den uendrede etterspørselskurven gir det høyere pris og lavere omsatt mengde.'
    };
  }

  // ---------- Øktmotor ----------
  planWeighted(p, ids, n) {
    const w = (id) => { const c = p.concepts[id]; if (!c || !c.seen) return 2; if (c.missed) return 4; if (c.typesOk.length >= this.need(id)) return 0.6; return 2.5; };
    const plan = [];
    let bag = ids.slice();
    while (plan.length < n && ids.length) {
      if (!bag.length) bag = ids.slice();
      let cand = bag.filter((id) => id !== plan[plan.length - 1]);
      if (!cand.length) cand = bag;
      const tot = cand.reduce((s, id) => s + w(id), 0);
      let x = Math.random() * tot, pick = cand[cand.length - 1];
      for (let i = 0; i < cand.length; i++) { x -= w(cand[i]); if (x <= 0) { pick = cand[i]; break; } }
      plan.push(pick);
      bag.splice(bag.indexOf(pick), 1);
    }
    return plan;
  }
  planExam(ids, n) {
    const plan = [];
    while (plan.length < n) {
      const round = this.shuffle(ids);
      if (round[0] === plan[plan.length - 1] && round.length > 1) { const t = round[0]; round[0] = round[1]; round[1] = t; }
      plan.push(...round);
    }
    return plan.slice(0, n);
  }
  avoidFor(s, cid) { return s.qs.filter((q) => q && q.cid === cid).map((q) => q.type); }

  startSession(st, mode, subject, conceptId) {
    const p = this.clone(st.progress);
    let plan;
    if (mode === 'concept') plan = [conceptId, conceptId, conceptId, conceptId];
    else if (mode === 'exam') plan = this.planExam(this.poolIds(subject), 30);
    else if (mode === 'weak') {
      const weak = this.weakIds(p, subject);
      if (!weak.length) return this.startSession(st, 'quick', subject, null);
      plan = this.planWeighted(p, weak, Math.min(10, weak.length * 3));
    } else plan = this.planWeighted(p, this.poolIds(subject), 10);
    const now = Date.now();
    const s = { mode, subject, conceptId, plan, qs: [], i: 0, sel: null, inp: '', checked: false, combo: 0, answers: [], reasked: [], xp: 0,
      parts: { base: 0, combo: 0, comeback: 0 }, gain: null, newly: false, backMsg: '', xpStart: p.xp, dailyStart: p.daily.xp,
      startedAt: now, deadline: mode === 'exam' ? now + 15 * 60 * 1000 : null };
    s.qs[0] = this.genQuestion(p, plan[0], []);
    return Object.assign({}, st, { progress: p, session: s, screen: 'question', now });
  }

  record(p, s, q, sel, exam) {
    const ok = q.num ? this.numOk(q.num, sel) : q.options[sel].correct;
    const cp = this.cp(p, q.cid);
    const wasMissed = cp.missed, need = this.need(q.cid), wasMastered = cp.typesOk.length >= need;
    cp.seen++; p.answered++;
    const ts = p.typeStats[q.type] || { n: 0, c: 0 }; ts.n++; if (ok) ts.c++; p.typeStats[q.type] = ts;
    p.recent[q.s] = (p.recent[q.s] || []).concat(ok ? 1 : 0).slice(-20);
    let gain = null, newly = false, backMsg = '';
    if (ok) {
      p.correct++; cp.ok++;
      const okKey = q.fqi != null ? 'Flervalg#' + q.fqi : q.type;
      if (!cp.typesOk.includes(okKey)) cp.typesOk.push(okKey);
      cp.missed = false;
      newly = !wasMastered && cp.typesOk.length >= need;
    } else { cp.bad++; cp.missed = true; }
    if (!exam) {
      if (ok) {
        s.combo++;
        const base = wasMastered ? 5 : 10;
        const parts = [wasMastered ? 'Repetisjon +5' : 'Riktig +10'];
        let total = base; s.parts.base += base;
        if (wasMissed) { total += 10; s.parts.comeback += 10; parts.push('Comeback +10'); }
        if (s.combo >= 2) { const b = Math.min((s.combo - 1) * 5, 15); total += b; s.parts.combo += b; parts.push('Combo ×' + s.combo + ' +' + b); }
        gain = { total, parts };
        p.xp += total; p.daily.xp += total; s.xp += total;
      } else {
        s.combo = 0;
        const name = this.byId[q.cid].n;
        if (!s.reasked.includes(q.cid) && s.i + 2 < s.plan.length && s.mode !== 'concept') {
          const pos = Math.min(s.i + 3, s.plan.length - 1);
          s.plan.splice(pos, 0, q.cid); s.plan.pop(); s.reasked.push(q.cid);
          backMsg = '«' + name + '» kommer tilbake om litt i denne økten, med en ny vinkel.';
        } else backMsg = '«' + name + '» kommer tilbake i neste økt, med en ny vinkel og ekstra XP.';
      }
    }
    s.answers.push({ cid: q.cid, type: q.type, ok, sel, q, newly });
    return { gain, newly, backMsg };
  }

  advance(st, p, s) {
    if (s.i < s.plan.length - 1) {
      s.i++; s.sel = null; s.inp = ''; s.checked = false; s.gain = null; s.newly = false; s.backMsg = '';
      s.qs[s.i] = this.genQuestion(p, s.plan[s.i], this.avoidFor(s, s.plan[s.i]));
      return Object.assign({}, st, { progress: p, session: s });
    }
    const st2 = Object.assign({}, st, { progress: p, session: s });
    return s.mode === 'exam' ? this.finishExam(st2) : this.finishSession(st2);
  }

  finishSession(st) {
    const p = this.clone(st.progress), s = st.session;
    this.bumpStreak(p); p.sessions++;
    const seen = {};
    s.answers.forEach((a) => { seen[a.cid] = seen[a.cid] || { ok: 0, newly: false }; if (a.ok) seen[a.cid].ok++; if (a.newly) seen[a.cid].newly = true; });
    const kept = [], back = [];
    Object.keys(seen).forEach((id) => { if (p.concepts[id] && p.concepts[id].missed) back.push({ id, name: this.byId[id].n }); else if (seen[id].ok) kept.push({ id, name: this.byId[id].n, newly: seen[id].newly }); });
    const lvBefore = this.levelInfo(s.xpStart).level, lvAfter = this.levelInfo(p.xp).level;
    const last = { mode: s.mode, subject: s.subject, conceptId: s.conceptId, n: s.answers.length, correct: s.answers.filter((a) => a.ok).length,
      xp: s.xp, parts: s.parts, kept, back, levelUp: lvAfter > lvBefore, level: lvAfter, dailyStart: s.dailyStart, daily: p.daily.xp, streak: p.streak.count };
    return Object.assign({}, st, { progress: p, session: null, last, screen: 'summary' });
  }

  finishExam(st) {
    const p = this.clone(st.progress), s = st.session;
    const total = s.plan.length, correct = s.answers.filter((a) => a.ok).length;
    const pct = Math.round((100 * correct) / total), grade = this.gradeFor(pct), passed = grade !== 'F';
    const xp = correct * 10 + (this.KARAKTERBONUS[grade] || 0);
    p.xp += xp; p.daily.xp += xp;
    this.bumpStreak(p); p.sessions++;
    p.exams = p.exams.concat({ s: s.subject, pct, grade, passed, at: Date.now() }).slice(-20);
    const review = s.answers.filter((a) => !a.ok).map((a) => (a.q.num
      ? { stem: a.q.stem, chosen: this.numText(a.q.num, a.sel), why: this.numWhy(a.q, a.sel), right: this.numText(a.q.num, a.q.num.answer), explain: (a.q.steps || []).join(' ') }
      : { stem: a.q.stem, chosen: a.q.options[a.sel].text, why: a.q.options[a.sel].why, right: a.q.options.find((o) => o.correct).text, explain: a.q.explain }));
    const end = Math.min(st.now || Date.now(), s.deadline);
    const last = { mode: 'exam', subject: s.subject, total, correct, pct, grade, passed, xp, review, unanswered: total - s.answers.length, used: Math.max(0, end - s.startedAt) };
    return Object.assign({}, st, { progress: p, session: null, last, screen: 'examResult' });
  }

  reduce(st, type, arg) {
    if (type === 'go') return Object.assign({}, st, { screen: arg.screen, subject: arg.subject !== undefined ? arg.subject : st.subject, conceptId: arg.conceptId !== undefined ? arg.conceptId : st.conceptId, confirmReset: false });
    if (type === 'start') return this.startSession(st, arg.mode, arg.subject, arg.conceptId || null);
    if (type === 'sound') { const p = this.clone(st.progress); p.sound = !p.sound; return Object.assign({}, st, { progress: p }); }
    if (type === 'theme') { const p = this.clone(st.progress); p.theme = arg; return Object.assign({}, st, { progress: p }); }
    // Innlogging i prototypen: ingenting sjekkes eller sendes, og passordet lagres aldri.
    if (type === 'loginField') { const L = Object.assign({}, st.login || this.loginBlank(), { msg: '', err: false }); L[arg.k] = arg.v; return Object.assign({}, st, { login: L }); }
    if (type === 'loginSync') { const L = st.login || this.loginBlank(); return Object.assign({}, st, { login: Object.assign({}, L, { email: arg.email || L.email, pw: arg.pw || L.pw }) }); }
    if (type === 'togglePw') { const L = st.login || this.loginBlank(); return Object.assign({}, st, { login: Object.assign({}, L, { show: !L.show }) }); }
    if (type === 'loginInfo') { const L = st.login || this.loginBlank(); return Object.assign({}, st, { login: Object.assign({}, L, { msg: 'Det er ikke laget ennå i prototypen. Logg inn med en hvilken som helst e-post og et passord.', err: false }) }); }
    if (type === 'login') {
      const L0 = st.login || this.loginBlank(), o = typeof arg === 'object' && arg ? arg : { method: arg };
      const L = Object.assign({}, L0, { email: o.email || L0.email, pw: o.pw || L0.pw });
      arg = o.method;
      let name;
      if (arg === 'feide') name = 'Feide-bruker';
      else {
        const em = (L.email || '').trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return Object.assign({}, st, { login: Object.assign({}, L, { msg: 'Skriv inn en gyldig e-postadresse, for eksempel navn@student.bi.no.', err: true }) });
        if (!L.pw) return Object.assign({}, st, { login: Object.assign({}, L, { msg: 'Skriv inn passordet ditt.', err: true }) });
        name = em;
      }
      const p = this.clone(st.progress); p.user = { name, via: arg === 'feide' ? 'feide' : 'epost' };
      return Object.assign({}, st, { progress: p, screen: 'home', login: this.loginBlank() });
    }
    if (type === 'logout') { const p = this.clone(st.progress); p.user = null; return Object.assign({}, st, { progress: p, screen: 'login', session: null, login: this.loginBlank() }); }
    if (type === 'reset') {
      if (!st.confirmReset) return Object.assign({}, st, { confirmReset: true });
      return Object.assign({}, st, { progress: this.fresh(), confirmReset: false, screen: 'home', last: null, session: null });
    }
    if (type === 'again') {
      const l = st.last || {};
      return this.startSession(st, l.mode === 'exam' ? 'exam' : (l.mode || 'quick'), l.subject || null, l.conceptId || null);
    }
    if (type === 'examWeak') return this.startSession(st, 'weak', (st.last || {}).subject || null, null);
    const s0 = st.session;
    if (!s0) return st;
    if (type === 'exit') {
      const screen = s0.mode === 'concept' ? 'concept' : (s0.subject ? 'subject' : 'home');
      return Object.assign({}, st, { session: null, screen });
    }
    if (type === 'select') {
      if (s0.checked) return st;
      const s = Object.assign({}, s0, { sel: arg });
      return Object.assign({}, st, { session: s });
    }
    if (type === 'input') {
      if (s0.checked) return st;
      const s = Object.assign({}, s0, { inp: String(arg), sel: this.parseNum(arg) });
      return Object.assign({}, st, { session: s });
    }
    if (type === 'check') {

      const r = this.record(p, s, s.qs[s.i], s.sel, false);

      return Object.assign({}, st, { progress: p, session: s });
    }
    if (type === 'next') {
      const p = this.clone(st.progress), s = this.clone(s0);
      if (s.mode === 'exam') {

        this.record(p, s, s.qs[s.i], s.sel, true);

      return this.advance(st, p, s);
    }
    if (type === 'timeout') {
      if (s0.mode !== 'exam') return st;
      return this.finishExam(Object.assign({}, st, { now: s0.deadline }));
    }
    return st;
  }

  dispatch(type, arg) {
    const before = this.state;
    const ns = this.reduce(before, type, arg);
    if (ns === before) return;
    this.setState(ns);
    if (!this.props.demo && ns.progress !== before.progress) this.save(ns.progress);
    this.soundFor(type, before, ns);
  }

  // ---------- Lydeffekter ----------
  // Alle lyder lages i nettleseren med Web Audio, uten lydfiler. De spilles bare etter at brukeren har trykket på noe.
  soundFor(type, before, ns) {
    const on = ns.progress.sound;
    if (type === 'sound') { if (on) this.sfx('toggle'); return; }
    if (!on) return;
    if (type === 'select') return this.sfx('tick');
    if (type === 'theme') return this.sfx('toggle');
    if (type === 'start' || type === 'again' || type === 'examWeak') return ns.screen === 'question' ? this.sfx('start') : null;
    if (type === 'login' && ns.screen === 'home' && before.screen === 'login') return this.sfx('welcome');
    if (type === 'check' && ns.session) {
      const a = ns.session.answers[ns.session.answers.length - 1];
      if (!a) return;
      if (!a.ok) return this.sfx('wrong');
      return this.sfx(ns.session.newly ? 'master' : 'right', { combo: ns.session.combo });
    }
    if ((type === 'next' || type === 'timeout') && before.screen === 'question') {
      if (ns.screen === 'summary' && ns.last) {
        const l = ns.last;
        if (l.levelUp) return this.sfx('levelup');
        if (l.dailyStart < this.GOAL && l.daily >= this.GOAL) return this.sfx('goal');
        return this.sfx('complete');
      }
      if (ns.screen === 'examResult' && ns.last) return this.sfx(ns.last.grade !== 'F' ? 'pass' : 'fail');
      if (ns.session && ns.session.mode === 'exam') return this.sfx('tick');
    }
  }

  audio() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!this.ac) {
        this.ac = new Ctx();
        // Felles kjede: en myk kompressor og litt romklang gjør at lydene glir sammen og aldri blir skarpe.
        const comp = this.ac.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 3;
        this.master = this.ac.createGain(); this.master.gain.value = 0.9;
        const dry = this.ac.createGain(), wet = this.ac.createGain(), delay = this.ac.createDelay(), fb = this.ac.createGain(), lp = this.ac.createBiquadFilter();
        dry.gain.value = 1; wet.gain.value = 0.16; delay.delayTime.value = 0.11; fb.gain.value = 0.28; lp.type = 'lowpass'; lp.frequency.value = 2600;
        this.bus = this.ac.createGain();
        this.bus.connect(dry); dry.connect(comp);
        this.bus.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(comp);
        comp.connect(this.master); this.master.connect(this.ac.destination);

      return this.ac;
    } catch (e) { return null; }
  }
  // Én tone med en klokkeaktig klang: grunntone pluss svake overtoner, rask anslag og myk utklinging.
  bell(ac, f, t, dur, vol, opts) {
    const o = opts || {};
    const parts = o.parts || [[1, 1], [2, 0.32], [3.01, 0.12], [4.2, 0.05]];
    parts.forEach((pt) => {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.wave || 'sine';
      osc.frequency.setValueAtTime(f * pt[0], t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(f * pt[0] * o.slide, t + dur * 0.6);
      const peak = vol * pt[1];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + (o.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / (pt[0] > 1 ? 1.6 : 1));
      osc.connect(g); g.connect(this.bus);
      osc.start(t); osc.stop(t + dur + 0.05);
    });
  }
  // Kort, filtrert støy: brukes som et lite «klikk» når man velger et svar.
  click(ac, t, vol, freq) {
    const n = Math.floor(ac.sampleRate * 0.03), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
    const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq || 2400; bp.Q.value = 1.4; g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(this.bus); src.start(t);
  }
  sfx(name, opt) {
    const ac = this.audio();
    if (!ac) return;
    try {
      const t = ac.currentTime + 0.01, st = (n) => Math.pow(2, n / 12), C5 = 523.25;
      if (name === 'tick') { this.click(ac, t, 0.5, 2600); this.bell(ac, 1760, t, 0.06, 0.03, { parts: [[1, 1]] }); return; }
      if (name === 'toggle') { this.click(ac, t, 0.35, 1800); this.bell(ac, 880, t, 0.09, 0.04, { parts: [[1, 1]] }); return; }
      if (name === 'start') {
        [0, 7].forEach((s, i) => this.bell(ac, 392 * st(s), t + i * 0.07, 0.35, 0.09, { wave: 'triangle', parts: [[1, 1], [2, 0.15]] }));
        return;
      }
      if (name === 'right') {
        // Durtreklang som stiger litt for hvert riktige svar på rad.
        const lift = Math.min((opt && opt.combo ? opt.combo - 1 : 0), 7), base = C5 * st(lift);
        [0, 4, 7].forEach((s, i) => this.bell(ac, base * st(s), t + i * 0.055, 0.55, 0.11));
        return;
      }
      if (name === 'wrong') {
        // Myk og lav, så det ikke føles som straff.
        this.bell(ac, 220, t, 0.32, 0.12, { wave: 'triangle', slide: 0.84, parts: [[1, 1], [2, 0.1]] });
        this.bell(ac, 196, t + 0.12, 0.38, 0.09, { wave: 'triangle', slide: 0.9, parts: [[1, 1]] });
        return;
      }
      if (name === 'master') {
        [0, 4, 7, 12, 16].forEach((s, i) => this.bell(ac, C5 * st(s), t + i * 0.06, 0.7, 0.1));
        [19, 24].forEach((s, i) => this.bell(ac, C5 * st(s), t + 0.34 + i * 0.05, 0.5, 0.05, { parts: [[1, 1], [2, 0.2]] }));
        return;
      }
      if (name === 'complete') {
        [[0, 0], [4, 0.09], [7, 0.18], [12, 0.3]].forEach((n) => this.bell(ac, C5 * st(n[0]), t + n[1], 0.8, 0.1));
        return;
      }
      if (name === 'goal') {
        [[0, 0], [4, 0.08], [7, 0.16], [12, 0.26], [16, 0.36]].forEach((n) => this.bell(ac, C5 * st(n[0]), t + n[1], 0.9, 0.1));
        [0, 7, 12].forEach((s) => this.bell(ac, C5 * st(s - 12), t + 0.36, 1.1, 0.06, { wave: 'triangle', parts: [[1, 1]] }));
        return;
      }
      if (name === 'levelup') {
        [[0, 0], [4, 0.1], [7, 0.2], [12, 0.3], [7, 0.42], [12, 0.52], [16, 0.62], [19, 0.72], [24, 0.84]].forEach((n) => this.bell(ac, C5 * st(n[0]), t + n[1], 0.7, 0.09));

        return;
      }
      if (name === 'pass') {
        [0, 4, 7, 12].forEach((s) => this.bell(ac, C5 * st(s), t, 1.4, 0.08));
        this.bell(ac, C5 * st(19), t + 0.25, 0.9, 0.05);
        return;
      }
      if (name === 'fail') {
        [0, 3, 7].forEach((s) => this.bell(ac, 392 * st(s), t, 1.1, 0.07, { wave: 'triangle', parts: [[1, 1], [2, 0.12]] }));
        return;
      }
      if (name === 'welcome') {
        [[0, 0], [7, 0.1], [12, 0.2]].forEach((n) => this.bell(ac, 440 * st(n[0]), t + n[1], 0.7, 0.08));
        return;
      }
    } catch (e) {}
  }

  // ---------- Eksempeldata (for skjermoversikten) ----------
  simulate(st, mode, subject, acc, stopAt) {
    st = this.startSession(st, mode, subject, null);
    let guard = 0;
    while (st.screen === 'question' && guard++ < 300) {
      const s = st.session;
      if (stopAt != null && s.i >= stopAt && s.sel === null && !s.checked) return st;
      if (!s.checked) {
        const q = s.qs[s.i];
        if (q.num) {
          const v = Math.random() < acc ? q.num.answer : q.num.answer + 7 + Math.round(Math.random() * 10);
          st = this.reduce(st, 'input', this.nf(v));
        } else {
          const ci = q.options.findIndex((o) => o.correct);
          const sel = Math.random() < acc ? ci : this.rnd([0, 1, 2, 3].filter((i) => i !== ci));
          st = this.reduce(st, 'select', sel);
        }
        if (mode !== 'exam') st = this.reduce(st, 'check');
      }
      st = this.reduce(st, 'next');
    }
    return st;
  }
  seedDemo(st) {
    [['oal', 0.9, 4], ['vt', 0.6, 2], ['sok', 0.8, 3]].forEach((r) => { for (let i = 0; i < r[2]; i++) st = this.simulate(st, 'quick', r[0], r[1], null); });
    const p = this.clone(st.progress), t = Date.now();
    p.days = [];
    for (let k = 6; k >= 1; k--) p.days.push(this.dayStr(new Date(t - k * 864e5)));
    p.streak = { count: 6, best: 9, last: this.yesterday(), brokeFrom: 0 };
    p.daily = { day: this.today(), xp: 30 };
    return Object.assign({}, st, { progress: p, screen: 'home', session: null, last: null });
  }
  applyStart(st, start) {
    if (start === 'login') return Object.assign({}, st, { screen: 'login' });
    if (start === 'subject') return Object.assign({}, st, { screen: 'subject', subject: 'oal' });
    if (start === 'concept') return Object.assign({}, st, { screen: 'concept', subject: 'sok', conceptId: 'sok-elast' });
    if (start === 'profile') return Object.assign({}, st, { screen: 'profile' });
    if (start === 'question') return this.startSession(Object.assign({}, st, { subject: 'oal' }), 'quick', 'oal', null);
    if (start === 'feedback') {
      st = this.startSession(Object.assign({}, st, { subject: 'sok' }), 'quick', 'sok', null);
      const q = st.session.qs[0];
      st = this.reduce(st, 'select', q.options.findIndex((o) => !o.correct));
      return this.reduce(st, 'check');
    }
    if (start === 'summary') return this.simulate(Object.assign({}, st, { subject: 'vt' }), 'quick', 'vt', 0.7, null);
    if (start === 'exam') {
      st = this.simulate(Object.assign({}, st, { subject: 'vt' }), 'exam', 'vt', 0.7, 11);
      return Object.assign({}, st, { now: st.session.startedAt + 263000 });
    }
    if (start === 'examResult') return this.simulate(Object.assign({}, st, { subject: 'sok' }), 'exam', 'sok', 0.8, null);
    return st;
  }

  // ---------- Visning ----------
  loginBlank() { return { email: '', pw: '', show: false, msg: '', err: false }; }
  vmLogin(st) {
    const L = st.login || this.loginBlank();

    return {
      email: L.email, pw: L.pw, show: !!L.show, hidden: !L.show, pwType: L.show ? 'text' : 'password', pwLabel: L.show ? 'Skjul passord' : 'Vis passord',

    };
  }
  vmHome(st) {

    else msg = p.daily.xp >= this.GOAL ? 'Dagens mål er nådd. Alt videre er bonus!' : 'Streaken er sikret for i dag. ' + (this.GOAL - p.daily.xp) + ' XP igjen til dagens mål.';
    if (!done) msgTitle = sk.count > 0 ? 'Hold streaken i gang i dag.' : (sk.brokeFrom ? 'Det skjer alle. Start på nytt i dag.' : 'Ta din første økt i dag.');
    else msgTitle = p.daily.xp >= this.GOAL ? 'Dagens mål er nådd.' : 'Streaken er sikret for i dag.';
    const goalPart = p.daily.xp >= this.GOAL ? 'Alt videre er bonus' : (this.GOAL - p.daily.xp) + ' XP igjen til dagens mål';
    const streakPart = sk.count > 0 ? sk.count + (sk.count === 1 ? ' dag' : ' dager') + ' på rad' : (sk.brokeFrom ? 'Forrige streak var ' + sk.brokeFrom + ' dager' : 'Streaken starter med første økt');
    const msgSub = goalPart + '.';
    const lab = ['S', 'M', 'T', 'O', 'T', 'F', 'L'], week = [];
    for (let k = 6; k >= 0; k--) {

      let dot = 'width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ';

        barStyle: 'position: absolute; left: 0; top: 0; height: 8px; min-width: 8px; border-radius: 4px; width: ' + x.pct + '%; background: ' + S.color + '; transition: width .4s ease;',

    const weak = this.weakIds(p, null).length;
    return {

      streakSub: sk.count > 0 ? 'på rad' : (sk.brokeFrom ? 'Forrige streak var ' + sk.brokeFrom + ' dager' : 'Streaken starter med første økt'),

  vmSubject(st) {

      topics, weakDisabled: weak === 0, weakSub: weak ? weak + ' begreper' : 'ingen ennå',
      primaryStyle: 'height: 60px; border-radius: 30px; border: none; background: ' + S.color + '; color: var(--on-subj); font-size: 17px; font-weight: 700; cursor: pointer; width: 100%;',
      startQuick: () => this.dispatch('start', { mode: 'quick', subject: key }),

  }

  vmConcept(st) {
    const p = st.progress, c = this.byId[st.conceptId] || this.concepts[0], S = this.SUBJ[c.s];
    const cp = p.concepts[c.id] || { typesOk: [], seen: 0, missed: false };
    const topic = S.topics.find((t) => t.id === c.t);
    const n = cp.typesOk.length, need = this.need(c.id), what = c.fq ? 'spørsmål' : 'spørsmålstyper';

    else if (cp.missed) statusText = 'Du bommet sist. Begrepet kommer oftere tilbake til du svarer riktig.';
    else if (cp.seen) statusText = 'Riktig på ' + n + ' av ' + need + ' ' + what + ' som trengs for å mestre begrepet.';
    else statusText = 'Ikke øvd ennå. Svar riktig på ' + need + ' ulike ' + what + ' for å mestre begrepet.';
    const markBase = 'width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; ';
    return {
      name: c.n, topic: S.short + ' · ' + topic.name, x: c.x, mis: c.m || [], ex: c.ex || [], statusText, unverified: this.unverified(c.id), unverifiedText: 'Ikke sjekket mot pensum',
      isFq: !!c.fq, hasMis: !!(c.m && c.m.length), hasEx: !!(c.ex && c.ex.length),
      fq: (c.fq || []).map((f, i) => {
        const ok = cp.typesOk.includes('Flervalg#' + i);
        return { q: f[0], a: f[1], unconfirmed: f[4] === 0, mark: ok ? '✓' : String(i + 1),
          markStyle: markBase + (ok ? 'background: var(--good-soft); color: var(--good-ink);' : 'background: ' + S.soft + '; color: var(--ink);') };
      }),
      dotStyle: 'width: 10px; height: 10px; border-radius: 5px; background: ' + S.color + ';',
      bulletStyle: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; margin-top: 7px; background: ' + S.color + ';',
      types: (c.fq ? c.fq.map((f, i) => ['Flervalg#' + i, 'Spørsmål ' + (i + 1)]) : this.typesFor(c).map((t) => [t, t])).map(([k, t]) => {
        const ok = cp.typesOk.includes(k);
        return { label: (ok ? '✓ ' : '') + t, chipStyle: 'font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; ' + (ok ? 'background: var(--good-soft); color: var(--good-ink);' : 'background: var(--surface-2); color: var(--text-2);') };
      }),
      back: () => this.dispatch('go', { screen: 'subject', subject: c.s }),
      start: () => this.dispatch('start', { mode: 'concept', subject: c.s, conceptId: c.id })
    };
  }

  vmQuestion(st) {
    const s = st.session;
    const empty = { options: [], gainParts: [], steps: [], stem: '', counter: '', type: '', subjShort: '' };
    if (!s || !s.qs[s.i]) return empty;
    const q = s.qs[s.i], S = this.SUBJ[q.s], isExam = s.mode === 'exam', isNum = !!q.num;
    const letters = ['A', 'B', 'C', 'D'];
    const chosen = !isNum && s.sel !== null ? q.options[s.sel] : null;
    const options = q.options.map((o, idx) => {
      let state = '';
      if (!s.checked) state = s.sel === idx ? 'sel' : '';
      else if (o.correct) state = 'right';
      else if (idx === s.sel) state = 'wrong';
      else state = 'dim';
      return { text: o.text, letter: letters[idx], state, selected: s.sel === idx, visible: state !== 'dim',
        showLetter: state !== 'right' && state !== 'wrong', showCheck: state === 'right', showCross: state === 'wrong',
        pick: () => this.dispatch('select', idx) };
    });
    const total = s.plan.length, done = s.i + (s.checked ? 1 : 0), last = s.i === total - 1;
    const numOk = isNum && this.numOk(q.num, s.sel);
    const isRight = isNum ? !!(s.checked && numOk) : !!(s.checked && chosen && chosen.correct);
    const isWrong = isNum ? !!(s.checked && !numOk) : !!(s.checked && chosen && !chosen.correct);
    let label = 'Sjekk svar';
    if (isExam) label = last ? 'Lever eksamen' : 'Neste';
    else if (s.checked) label = last ? 'Se oppsummering' : 'Fortsett';
    const left = isExam ? Math.max(0, s.deadline - (st.now || Date.now())) : 0;
    const mm = Math.floor(left / 60000), ss = Math.floor((left % 60000) / 1000);
    const low = left < 120000;
    return {
      stem: q.stem, type: q.type, subjShort: S.short, counter: (s.i + 1) + ' / ' + total,
      conceptName: this.byId[q.cid].n, explain: q.explain, chosenWhy: isNum ? this.numWhy(q, s.sel) : (chosen ? chosen.why : ''), backMsg: s.backMsg,
      unverified: q.fqi != null ? q.src === 0 : this.unverified(q.cid), unverifiedText: q.fqi != null ? 'Svaret er ikke bekreftet i quizen' : 'Ikke sjekket mot pensum', isNum, inputVal: s.inp || '', unit: isNum ? q.num.unit : '', tolText: isNum ? q.num.hint : '',
      numState: !s.checked ? '' : (isRight ? 'right' : 'wrong'),
      onInput: (e) => this.dispatch('input', e && e.target ? e.target.value : ''),
      steps: q.steps || [], hasSteps: !!(q.steps && q.steps.length && s.checked),
      options, isExam, isPractice: !isExam, locked: !isExam && s.checked, isRight, isWrong, newly: isRight && s.newly,
      xp: s.xp, combo: s.combo, showCombo: !isExam && s.combo >= 2,
      gainTotal: s.gain ? s.gain.total : 0, gainParts: s.gain ? s.gain.parts : [], showGain: !!s.gain,
      rightTitle: s.combo >= 3 ? 'Riktig! ' + s.combo + ' på rad' : 'Riktig!',
      total, done: isExam ? s.i : done,
      timerText: mm + ':' + String(ss).padStart(2, '0'),
      timerStyle: 'display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 13px; border-radius: 20px; font-size: 14px; font-weight: 600; flex-shrink: 0; font-variant-numeric: tabular-nums; ' + (low ? 'background: var(--bad-soft); color: var(--bad-ink); border: 1px solid var(--bad);' : 'background: var(--surface); color: var(--ink); border: 1px solid var(--line);'),
      progressStyle: 'height: 100%; border-radius: 5px; background: ' + S.color + '; transition: width .3s ease; width: ' + ((isExam ? s.i : done) / total) * 100 + '%;',
      dotStyle: 'width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: ' + S.color + ';',
      noSelection: !s.checked && s.sel === null, primaryLabel: label,
      primaryAction: () => this.dispatch(!isExam && !this.state.session.checked ? 'check' : 'next'),
      primaryStyle: 'width: 100%; height: 60px; border-radius: 30px; border: 1px solid ' + (isRight ? 'var(--good)' : 'var(--cta-line)') + '; background-color: ' + (isRight ? 'var(--good)' : 'var(--cta)') + '; background-image: ' + (isRight ? 'none' : 'linear-gradient(180deg, var(--cta-hi), transparent)') + '; color: ' + (isRight ? 'var(--on-good)' : 'var(--cta-fg)') + '; font-size: 17px; font-weight: 700; cursor: pointer;',
      exit: () => this.dispatch('exit')
    };
  }

  vmSummary(st) {
    const l = st.last && st.last.mode !== 'exam' ? st.last : null;
    if (!l) return { parts: [], kept: [], back: [] };
    const parts = [];
    if (l.parts.base) parts.push('Riktige svar +' + l.parts.base);
    if (l.parts.combo) parts.push('Combo +' + l.parts.combo);
    if (l.parts.comeback) parts.push('Comeback +' + l.parts.comeback);
    const goalNow = Math.min(l.daily, this.GOAL);
    let goalText;
    if (l.dailyStart < this.GOAL && l.daily >= this.GOAL) goalText = 'Dagens mål er nådd! Streak: ' + l.streak + (l.streak === 1 ? ' dag.' : ' dager.');
    else if (l.daily >= this.GOAL) goalText = 'Dagens mål var allerede nådd. Dette er ren bonus.';
    else goalText = (this.GOAL - l.daily) + ' XP igjen til dagens mål. Streak: ' + l.streak + (l.streak === 1 ? ' dag.' : ' dager.');
    const ratio = l.n ? l.correct / l.n : 0;
    return {
      title: ratio >= 0.8 ? 'Sterk økt!' : ratio >= 0.5 ? 'Godt jobbet!' : 'Bra at du øvde!',
      xp: l.xp, correct: l.correct, n: l.n, parts, levelUp: l.levelUp, level: l.level,
      goalNow, goalText, goalBarStyle: 'height: 100%; border-radius: 5px; background: var(--accent); width: ' + (goalNow / this.GOAL) * 100 + '%;',
      kept: l.kept, hasKept: l.kept.length > 0, noKept: l.kept.length === 0,
      back: l.back, hasBack: l.back.length > 0, noBack: l.back.length === 0,
      again: () => this.dispatch('again')
    };
  }

  vmExam(st) {
    const l = st.last && st.last.mode === 'exam' ? st.last : null;
    if (!l) return { review: [] };
    const S = this.SUBJ[l.subject], x = this.subjStats(st.progress, l.subject);
    const mins = Math.floor(l.used / 60000), secs = Math.floor((l.used % 60000) / 1000);
    let meta = 'Tid brukt ' + mins + ':' + String(secs).padStart(2, '0') + ' · +' + l.xp + ' XP';
    if (l.unanswered) meta = 'Tiden gikk ut, ' + l.unanswered + ' spørsmål ubesvart · +' + l.xp + ' XP';
    const hasWrong = l.review.length > 0;
    return {
      subjName: S.name, title: 'Karakter ' + l.grade, grade: l.grade, pct: l.pct, correct: l.correct, total: l.total, meta, scaleNote: this.scaleNote(),
      badgeStyle: 'width: 124px; height: 124px; box-sizing: border-box; border-radius: 30px; border: 3px solid currentColor; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transform: rotate(-4deg); ' + (l.grade !== 'F' ? 'background: var(--good-soft); color: var(--good-ink);' : 'background: var(--warn-soft); color: var(--warn-ink);'),
      ready: x.ready, readyBarStyle: 'height: 100%; border-radius: 5px; background: ' + S.color + '; width: ' + x.ready + '%;',
      review: l.review, hasReview: hasWrong, noReview: !hasWrong,
      primaryLabel: hasWrong ? 'Øv på det du bommet på' : 'Ta en rask økt',
      primaryAction: () => this.dispatch(hasWrong ? 'examWeak' : 'start', hasWrong ? undefined : { mode: 'quick', subject: l.subject })
    };
  }

  vmProfile(st) {
    const p = st.progress, lv = this.levelInfo(p.xp);
    const acc = p.answered ? Math.round((100 * p.correct) / p.answered) : 0;
    return {
      xp: p.xp,
      levelBarStyle: 'height: 100%; border-radius: 5px; background: var(--gold); width: ' + Math.round((100 * lv.into) / lv.span) + '%;',
      stats: [
        { value: p.streak.count + ' d', label: 'Streak nå (beste ' + p.streak.best + ')' },
        { value: String(p.sessions), label: 'Økter fullført' },
        { value: String(p.answered), label: 'Spørsmål besvart' },
        { value: acc + ' %', label: 'Treffsikkerhet' }
      ],
      subjects: Object.keys(this.SUBJ).map((key) => {
        const S = this.SUBJ[key], x = this.subjStats(p, key);
        return { name: S.name, pct: x.pct, ready: x.ready, barStyle: 'height: 100%; border-radius: 4px; background: ' + S.color + '; width: ' + x.pct + '%;' };
      }),
      types: this.TYPES.map((t) => {
        const ts = p.typeStats[t] || { n: 0, c: 0 }, pct = ts.n ? Math.round((100 * ts.c) / ts.n) : 0;
        return { label: t, text: ts.n ? pct + ' %' : '–', barStyle: 'height: 100%; border-radius: 4px; background: var(--ink); width: ' + pct + '%;' };
      }),
      switchStyle: 'width: 48px; height: 28px; border-radius: 14px; padding: 3px; box-sizing: border-box; display: flex; transition: background .2s ease; ' + (p.sound ? 'background: var(--good); justify-content: flex-end;' : 'background: var(--line-strong); justify-content: flex-start;'),
      knobStyle: 'width: 22px; height: 22px; border-radius: 11px; background: var(--knob); box-shadow: 0 1px 3px rgba(0,0,0,.25);',
      themes: [['auto', 'System'], ['light', 'Lys'], ['dark', 'Mørk']].map((t) => {
        const on = (p.theme || 'auto') === t[0];
        return { label: t[1], pressed: on, pick: () => this.dispatch('theme', t[0]),
          style: 'min-width: 58px; min-height: 40px; padding: 0 10px; border: none; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: var(--surface); color: var(--ink); box-shadow: var(--shadow);' : 'background: transparent; color: var(--muted);') };
      }),
      userName: p.user ? p.user.name : '', logout: () => this.dispatch('logout'),
      resetLabel: st.confirmReset ? 'Trykk igjen for å slette all fremdrift' : 'Nullstill fremdrift',
      reset: () => this.dispatch('reset')
    };
  }

  renderVals() {
    const st = this.state, p = st.progress;
    return {
      scr: { login: st.screen === 'login', home: st.screen === 'home', subject: st.screen === 'subject', concept: st.screen === 'concept', question: st.screen === 'question', summary: st.screen === 'summary', examResult: st.screen === 'examResult', profile: st.screen === 'profile' },
      lvl: this.levelInfo(p.xp),
      soundOn: !!p.sound, soundOff: !p.sound, soundLabel: p.sound ? 'Slå av lyd' : 'Slå på lyd',
      toggleSound: () => this.dispatch('sound'),
      themeMode: this.themeMode(st), isDark: this.isDarkNow(st), isLight: !this.isDarkNow(st),
      themeLabel: this.isDarkNow(st) ? 'Bytt til lyst tema' : 'Bytt til mørkt tema',
      toggleTheme: () => this.dispatch('theme', this.isDarkNow(this.state) ? 'light' : 'dark'),
      goHome: () => this.dispatch('go', { screen: 'home' }),
      goProfile: () => this.dispatch('go', { screen: 'profile' }),
      login: this.vmLogin(st), home: this.vmHome(st), subj: this.vmSubject(st), con: this.vmConcept(st), qv: this.vmQuestion(st),
      sum: this.vmSummary(st), ex: this.vmExam(st), prof: this.vmProfile(st)
    };
  }
}

// ---------- Oppstart ----------
// «System»-temaet følger vertens valg (data-theme på rotelementet) når det finnes, ellers operativsystemet.
Component.prototype.systemDark = function () {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true;
  if (t === 'light') return false;
  try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return false; }
};
(function () {
  const target = document.getElementById('bestatt');
  if (!window.preact) {
    target.innerHTML = '<p class="lastefeil">Appen kunne ikke lastes. Sjekk internettforbindelsen og last inn siden på nytt.</p>';
    return;
  }
  // #demo åpner appen med eksempeldata. Da lagres ingenting.
  const demo = location.hash === '#demo';
  window.bestatt = bestattMotor.start(Component, { start: 'home', demo, theme: 'auto' }, document.getElementById('bestatt-mal'), target);
  try { new MutationObserver(bestattMotor.schedule).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
